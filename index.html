<!DOCTYPE html>
<!--
  아침 루틴 미션 · 7세 아침 루틴 대시보드 (단일 HTML 파일)
  · 사용법: 파일을 브라우저(사파리·크롬)로 열고, 아이패드/아이폰은 '홈 화면에 추가'하면 앱처럼 쓸 수 있어요.
  · 토·일은 저절로 '🌈 주말 모드'(가방 싸기 빼고 8단계)로, 월~금은 '🎒 평일 모드'(9단계)로 열려요.
    머리말의 모드 버튼으로 그날만 바꿀 수도 있어요.
  · 목표 시간은 요일마다 달라요: 월~목 08:00 · 금 08:35 · 토 08:30 · 일 08:20.
  · 할 일 타이머가 00:00이 되면 종료 알림음이 울려요(아이폰·아이패드는 '👩 엄마 설정 → 🔔 소리 테스트'로 미리 확인).
  · '🎲 놀기'는 따로 시간을 정하지 않고 남는 시간이 저절로 계산돼요. 평일에는 목표 3분 전에 놀이가 끝나고,
    남은 3분 동안 '🎒 아이패드 · 이어폰 · 숙제가방 싸기'가 이어서 시작돼요.
  · 할 일 타이머가 끝나면 그 할 일은 자동으로 완료되고, 다음 할 일 타이머가 저절로 이어서 시작돼요.
    (타이머 없이 ✓ '됐어요!'를 눌러도 다음 할 일이 저절로 시작돼요.)
  · 목표 시간은 오른쪽 위 '👩 엄마 설정'에서 요일 묶음(월~목 / 금 / 토 / 일)마다 따로 바꿀 수 있어요.
  · 진행 상황·별·연속 기록은 이 브라우저의 localStorage에 저장되고, 날짜가 바뀌면 체크가 자동으로 초기화돼요.
  · 인터넷 연결이나 외부 파일 없이 혼자서 동작해요.
-->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7fbff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>아침 루틴 미션</title>
<style>
  :root{
    --ink:#22314e;
    --ink-soft:#6b7a95;
    --line:#e6ecf6;
    --blue:#3f7cf6;
    --mint:#1fae7d;
    --amber:#e39400;
    --coral:#e2464e;
    --card:#ffffff;
    --shadow:0 10px 30px rgba(46,72,120,.10), 0 2px 6px rgba(46,72,120,.06);
  }
  *,*::before,*::after{box-sizing:border-box}
  [hidden]{display:none !important}
  html,body{margin:0;padding:0}
  body{
    min-height:100vh;
    color:var(--ink);
    font-family:'Apple SD Gothic Neo','Pretendard Variable',Pretendard,'Noto Sans KR','Malgun Gothic',system-ui,-apple-system,'Segoe UI',sans-serif;
    background:
      radial-gradient(1100px 560px at 102% -8%, #fff1cf 0%, rgba(255,241,207,0) 62%),
      radial-gradient(900px 520px at -8% -4%, #dcebff 0%, rgba(220,235,255,0) 58%),
      linear-gradient(180deg,#f7fbff 0%, #fffdf8 100%);
    background-attachment:fixed;
    -webkit-text-size-adjust:100%;
    -webkit-tap-highlight-color:transparent;
    padding-bottom:calc(24px + env(safe-area-inset-bottom));
  }
  button{font-family:inherit}
  button:focus-visible{outline:3px solid #9dc0ff;outline-offset:2px}

  /* ---------- top bar ---------- */
  .topbar{
    position:sticky;top:0;z-index:30;
    display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;
    padding:10px clamp(14px,3vw,28px);
    background:rgba(255,255,255,.82);
    -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
    border-bottom:1px solid rgba(226,234,246,.9);
  }
  .brand{display:flex;align-items:center;gap:10px;flex:1 1 190px;min-width:0}
  .logo{
    width:46px;height:46px;flex:none;border-radius:15px;display:grid;place-items:center;font-size:25px;
    background:linear-gradient(135deg,#ffeaa6,#ffcf5c);
    box-shadow:0 6px 14px rgba(255,193,70,.35);
  }
  .brand-txt{min-width:0}
  .brand h1{font-size:1.16rem;margin:0;font-weight:900;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.25}
  #dateLabel{margin:1px 0 0;font-size:.76rem;color:#8493ab;font-weight:800}
  .now-box{display:flex;align-items:baseline;gap:1px;font-variant-numeric:tabular-nums;flex:none}
  .now-label{font-size:clamp(.78rem,1.3vw,.9rem);color:#93a0b6;font-weight:800;margin-right:6px;letter-spacing:.02em}
  .now-time{font-size:clamp(1.7rem,3vw,2.3rem);font-weight:900;letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums}
  .now-sec{font-size:clamp(.95rem,1.7vw,1.2rem);font-weight:800;color:#93a0b6;min-width:1.5em;font-variant-numeric:tabular-nums}
  .top-actions{display:flex;gap:8px;align-items:center;flex:none}
  .icon-btn{
    border:1px solid #e3eaf5;background:#fff;border-radius:14px;padding:10px 12px;
    font-weight:800;font-size:.9rem;cursor:pointer;color:var(--ink);
    box-shadow:0 2px 6px rgba(46,72,120,.06);touch-action:manipulation;white-space:nowrap;
    transition:background .15s,color .15s,border-color .15s,transform .12s;
  }
  .icon-btn:active{transform:scale(.96)}
  .icon-btn.active{background:#2c5fd0;color:#fff;border-color:#2c5fd0;box-shadow:0 6px 14px rgba(44,95,208,.28)}

  /* ---------- mode pill (평일 / 주말) ---------- */
  .mode-pill{
    display:inline-flex;align-items:center;gap:8px;
    border:1px solid #dbe6fa;background:linear-gradient(135deg,#eef4ff,#dce9ff);
    color:#22406f;border-radius:99px;padding:7px 14px 7px 10px;cursor:pointer;
    font:inherit;font-weight:900;touch-action:manipulation;white-space:nowrap;
    box-shadow:0 4px 12px rgba(63,124,246,.14);
    transition:background .35s,color .35s,border-color .35s,transform .12s,box-shadow .35s;
  }
  .mode-pill:active{transform:scale(.96)}
  .mode-pill .mp-face{font-size:1.25rem;line-height:1}
  .mode-pill .mp-body{display:flex;flex-direction:column;align-items:flex-start;line-height:1.15}
  .mode-pill .mp-text{font-size:.92rem;letter-spacing:-.01em}
  .mode-pill .mp-count{font-size:.68rem;font-weight:800;color:#6b86b3}
  .mode-pill.weekend{
    background:linear-gradient(135deg,#ffe6f3,#e8f0ff 48%,#dcfaee);
    border-color:#f4d3e7;color:#8a3a69;
    box-shadow:0 5px 16px rgba(217,110,170,.20);
  }
  .mode-pill.weekend .mp-count{color:#a86a8d}
  body.weekend-mode .logo{background:linear-gradient(135deg,#ffd9ec,#cfe4ff 55%,#c9f7e4);box-shadow:0 6px 14px rgba(180,150,220,.32)}
  body.weekend-mode{background:
    radial-gradient(1100px 560px at 102% -8%, #ffe9f4 0%, rgba(255,233,244,0) 62%),
    radial-gradient(900px 520px at -8% -4%, #e2f4ff 0%, rgba(226,244,255,0) 58%),
    linear-gradient(180deg,#fdf9ff 0%, #fbfeff 100%);
  }

  /* ---------- layout ---------- */
  .wrap{max-width:860px;margin:0 auto;padding:14px clamp(14px,3vw,28px) 40px}

  /* ---------- hero ---------- */
  .hero{display:block}

  .cd-card{
    --accent:#2f6fe4; --accent-soft:#e9f1ff; --accent-deep:#1e4fb8;
    position:relative;overflow:hidden;
    background:#fff;border:1px solid #ecf2fb;border-radius:28px;
    padding:20px clamp(18px,3vw,30px) 18px;
    box-shadow:var(--shadow);
  }
  .cd-card::after{
    content:'';position:absolute;right:-50px;bottom:-70px;width:220px;height:220px;border-radius:50%;
    background:var(--accent-soft);opacity:.85;z-index:0;transition:background .4s;
  }
  .cd-card::before{
    content:'';position:absolute;left:0;top:0;bottom:0;width:7px;background:linear-gradient(180deg,var(--accent),var(--accent-soft));z-index:1;
    transition:background .4s;
  }
  .cd-card > *{position:relative;z-index:2}
  .cd-card.calm{--accent:#12a06f;--accent-soft:#e4f9f0;--accent-deep:#0b7d56}
  .cd-card.tight{--accent:#d18400;--accent-soft:#fff2d8;--accent-deep:#9c6200}
  .cd-card.behind{--accent:#dc3b44;--accent-soft:#ffe6e8;--accent-deep:#a8242c}
  .cd-card.done{--accent:#2f6fe4;--accent-soft:#e8f1ff;--accent-deep:#1e4fb8}

  .cd-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
  .cd-label{font-size:clamp(1.02rem,1.9vw,1.4rem);font-weight:900;color:var(--accent-deep);letter-spacing:-.01em;transition:color .4s}
  .target-chip{
    display:inline-flex;align-items:center;gap:6px;
    border:1px solid #e6edf9;background:#f7faff;color:#3d4f6d;
    border-radius:99px;padding:8px 16px;font-size:clamp(.92rem,1.8vw,1.12rem);font-weight:800;cursor:pointer;
    touch-action:manipulation;transition:border-color .15s,background .15s;
  }
  .target-chip:hover{border-color:#c9d9f5;background:#eef4ff}
  .target-chip b{font-variant-numeric:tabular-nums;font-size:clamp(1rem,2vw,1.22rem);color:#22314e}
  .cd-time{
    font-size:clamp(2.4rem,7vw,4.4rem);line-height:1.02;font-weight:900;letter-spacing:-.035em;
    font-variant-numeric:tabular-nums;color:var(--accent);margin:6px 0 4px;
    transition:color .4s;
    display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;
  }
  .cd-time small{font-size:.3em;font-weight:900;letter-spacing:0;color:var(--accent-deep);opacity:.75}
  .cd-time.long{font-size:clamp(2.6rem,9vw,5.6rem);letter-spacing:-.025em}
  .cd-card.behind .cd-time{animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
  .cd-status{
    display:inline-block;margin-top:4px;
    background:var(--accent-soft);color:var(--accent-deep);
    border-radius:14px;padding:9px 15px;font-size:clamp(.98rem,1.8vw,1.18rem);font-weight:800;line-height:1.35;
    transition:background .4s,color .4s;
  }
  .cd-track{height:14px;border-radius:99px;background:#eef2f9;overflow:hidden;margin:14px 0 10px}
  .cd-fill{height:100%;width:0%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent-soft));transition:width .4s linear,background .4s}
  .cd-sub{font-size:clamp(.84rem,1.5vw,.98rem);font-weight:700;color:#7d8ba4;display:flex;gap:6px 16px;flex-wrap:wrap}
  .cd-sub span{white-space:nowrap}

  @media (max-width:560px){
    .topbar{padding:8px 14px;gap:8px 10px}
    .brand{flex:1 1 100%}
    .now-box{flex:1 1 auto}
    .now-time{font-size:1.62rem}
    .now-sec{font-size:.9rem}
    .icon-btn{padding:9px 11px;font-size:.84rem}
    .logo{width:40px;height:40px;font-size:22px;border-radius:13px}
    .brand h1{font-size:1.05rem}
    .cd-card{border-radius:24px;padding:16px 16px 14px}
    .cd-time.long{font-size:clamp(2.1rem,10vw,3rem)}
    .progress-card{padding:13px 15px}
  }
  .noscript{max-width:640px;margin:24px auto;padding:16px 20px;background:#fff3f3;border:1px solid #ffd6d6;border-radius:16px;font-weight:800;color:#a8242c;text-align:center}

  /* ---------- progress ---------- */
  .progress-card{
    background:#fff;border:1px solid #eef3fb;border-radius:24px;padding:14px 18px;margin-top:14px;
    box-shadow:var(--shadow);
  }
  .progress-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
  .p-title{font-size:1rem;font-weight:900;letter-spacing:-.01em}
  .p-pct{font-size:1.5rem;font-weight:900;color:var(--blue);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
  .progress-track{height:16px;background:#eef2f9;border-radius:99px;overflow:hidden;margin:8px 0 9px;position:relative}
  .progress-fill{
    height:100%;width:0%;border-radius:99px;
    background:linear-gradient(90deg,#5fd6a8,#3f8ef6 60%,#8a7bfa);
    transition:width .5s cubic-bezier(.22,1,.36,1);
    position:relative;overflow:hidden;
  }
  .progress-fill::after{
    content:'';position:absolute;inset:0;
    background:linear-gradient(100deg,transparent 20%,rgba(255,255,255,.55) 45%,transparent 70%);
    transform:translateX(-100%);animation:shine 2.8s ease-in-out infinite;
  }
  @keyframes shine{0%{transform:translateX(-100%)}55%,100%{transform:translateX(140%)}}
  .p-foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:.84rem;font-weight:800;color:#6b7a95}
  #nowTask{color:#2f6fe4}

  /* ---------- parent panel ---------- */
  .parent-panel{
    background:linear-gradient(180deg,#fff9ef,#fffdf9);
    border:1px solid #ffe7c2;border-radius:24px;padding:16px 18px;margin-top:14px;
    box-shadow:0 8px 24px rgba(190,140,40,.10);
  }
  .pp-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px}
  .pp-head span:first-child{font-size:1rem;font-weight:900}
  .pp-hint{font-size:.76rem;font-weight:800;color:#b08a45}
  .pp-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,300px));gap:12px;align-items:end;justify-content:start}
  .pp-grid .field{align-items:flex-start}
  .field{display:flex;flex-direction:column;gap:6px;font-size:.82rem;font-weight:800;color:#8a7350}
  .field input[type=time]{
    border:1px solid #ecdcc2;background:#fff;border-radius:12px;padding:9px 11px;font:inherit;font-size:1.05rem;
    font-weight:800;color:var(--ink);width:100%;font-variant-numeric:tabular-nums;
  }
  .field input[type=time]:focus{outline:2px solid #ffd28a;border-color:#f0c271}
  .btn-soft{
    border:1px solid #ecdcc2;background:#fff;border-radius:12px;padding:10px 12px;font:inherit;
    font-weight:800;font-size:.88rem;color:#6b5636;cursor:pointer;touch-action:manipulation;
    transition:background .15s,transform .12s;
  }
  .btn-soft:active{transform:scale(.97)}
  .btn-soft:hover{background:#fff5e6}
  .pp-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
  .pp-note{margin:12px 0 0;font-size:.78rem;font-weight:700;color:#a08a68;line-height:1.5}
  .pp-mode{
    margin:0 0 12px;font-size:.8rem;font-weight:800;color:#8a7350;
    background:#fff4e2;border:1px dashed #f0dcb6;border-radius:12px;padding:8px 11px;line-height:1.45;
  }
  .pp-mode b{color:#7a5a22}

  /* ---------- 요일별 목표 시간 (엄마 설정) ---------- */
  .pp-targets-head{margin:0 0 8px}
  #targetFieldLabel{font-size:.9rem;font-weight:900;color:#8a7350}
  .pp-targets{
    display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin-bottom:12px;
  }
  @media (max-width:640px){ .pp-targets{grid-template-columns:repeat(2,minmax(0,1fr))} }
  .tg{
    position:relative;display:flex;flex-direction:column;gap:3px;
    background:#fff;border:1.5px solid #ecdcc2;border-radius:14px;padding:9px 11px 8px;
    transition:border-color .2s,box-shadow .2s,background .2s;
  }
  .tg-top{display:flex;align-items:center;justify-content:space-between;gap:6px;min-height:18px}
  .tg-name{font-size:.82rem;font-weight:900;color:#8a7350;white-space:nowrap}
  .tg-badge{
    font-size:.64rem;font-weight:900;color:#fff;background:#e39400;border-radius:99px;
    padding:2px 7px;font-style:normal;letter-spacing:.02em;white-space:nowrap;
  }
  .tg input[type=time]{
    border:0;border-bottom:1px dashed #ecdcc2;background:transparent;border-radius:0;
    padding:2px 0 4px;font:inherit;font-size:1.12rem;font-weight:900;color:var(--ink);
    width:100%;font-variant-numeric:tabular-nums;
  }
  .tg input[type=time]:focus{outline:none;border-bottom:2px solid #e39400}
  .tg-sub{font-size:.66rem;font-weight:800;color:#b09a78;white-space:nowrap}
  .tg.today{
    background:linear-gradient(180deg,#fff8ec,#fffdf9);border-color:#f2b95e;
    box-shadow:0 4px 12px rgba(226,148,0,.16);
  }
  .tg.today .tg-name{color:#9a6200}
  .tg.ring{animation:tgRing 1.5s ease-out 2}
  @keyframes tgRing{0%,100%{box-shadow:0 0 0 0 rgba(243,166,60,0)}50%{box-shadow:0 0 0 6px rgba(243,166,60,.30)}}

  /* ---------- task grid ---------- */
  /* 아이폰(좁은 화면): 한 줄에 할 일 하나씩 */
  .grid{
    display:grid;gap:16px;margin-top:22px;padding-top:6px;
    grid-template-columns:1fr;
  }
  @media (max-width:520px){ .grid{gap:14px} }

  .card{
    position:relative;display:flex;flex-direction:column;gap:11px;
    background:#fff;border:2px solid transparent;border-radius:24px;padding:16px;
    box-shadow:var(--shadow);
    transition:background .3s,border-color .25s,box-shadow .25s,transform .15s;
  }
  .card:active{transform:scale(.995)}
  .card.current{
    border-color:#bdd6ff;
    box-shadow:0 0 0 5px rgba(63,124,246,.09), var(--shadow);
  }
  .card.done{
    background:linear-gradient(165deg,#f3fff9,#e7fbf1);
    border-color:#b7efd7;
  }
  .card.flash{animation:flash .75s ease-in-out 3}
  @keyframes flash{
    0%,100%{background:#fff;box-shadow:var(--shadow)}
    50%{background:#fff4f4;box-shadow:0 0 0 6px rgba(226,70,78,.18),var(--shadow)}
  }

  .card-head{display:flex;align-items:flex-start;gap:9px}
  .step{
    width:28px;height:28px;flex:none;border-radius:9px;display:grid;place-items:center;
    font-weight:900;font-size:.86rem;background:var(--acc,#eef4ff);color:var(--accInk,#3f7cf6);
  }
  .card-head .emoji{font-size:1.55rem;line-height:1.15;flex:none}
  .name{flex:1;font-size:1.1rem;font-weight:800;line-height:1.32;letter-spacing:-.01em;min-width:0}
  .card.done .name{color:#1f7d5c}
  .mins{
    flex:none;align-self:flex-start;font-size:.76rem;font-weight:800;color:#6b7a95;
    background:#f2f6fc;border-radius:99px;padding:4px 9px;font-variant-numeric:tabular-nums;white-space:nowrap;
  }
  .card.done .mins{background:#e2f7ec;color:#1f8a65}
  .mins.auto{background:linear-gradient(135deg,#fff3d9,#ffe6f0);color:#a2622a;box-shadow:0 2px 8px rgba(226,150,60,.16)}

  .timer{display:flex;align-items:center;gap:12px}
  .timer-time{
    font-size:1.85rem;font-weight:900;letter-spacing:-.03em;font-variant-numeric:tabular-nums;
    color:#3a4a66;min-width:104px;line-height:1;
  }
  .timer-time.wide{font-size:1.45rem;min-width:126px;letter-spacing:-.01em}
  .card.auto-card{border-color:#ffe2c4}
  .card.auto-card.current{border-color:#ffd09a;box-shadow:0 0 0 5px rgba(243,166,60,.12),var(--shadow)}
  .card.done .timer-time{color:#1fae7d;font-size:1.35rem}
  .timer-bar{flex:1;height:12px;border-radius:99px;background:#eef2f9;overflow:hidden;min-width:40px}
  .timer-bar i{
    display:block;height:100%;width:0%;border-radius:99px;
    background:linear-gradient(90deg,#9cc4ff,#4f8dfd);
    transition:width .3s linear,background .3s;
  }
  .card.running .timer-bar i{background:linear-gradient(90deg,#7fe5c0,#22c08a)}
  .card.low .timer-bar i{background:linear-gradient(90deg,#ffd27a,#f09a1a)}
  .card.done .timer-bar i{background:linear-gradient(90deg,#a9f0d4,#2fc48f);width:100% !important}

  .btns{display:flex;gap:9px;margin-top:auto}
  .btn{
    flex:1;border:0;border-radius:15px;padding:13px 8px;font:inherit;font-size:1rem;font-weight:900;
    cursor:pointer;touch-action:manipulation;transition:transform .12s,filter .15s,background .2s,color .2s;
    display:inline-flex;align-items:center;justify-content:center;gap:6px;line-height:1.1;
  }
  .btn:active{transform:scale(.97)}
  .btn-start{background:#edf3ff;color:#2a5ecc;flex:1}
  .btn-start:hover{background:#e2ecff}
  .btn-start:disabled{opacity:.55;cursor:default}
  .card.running .btn-start{background:#fff2d9;color:#a46500}
  .btn-reset{
    flex:0 0 50px;background:#f4f7fc;color:#5b6b86;border:1px solid #e6ecf6;font-size:1.15rem;
  }
  .btn-reset:hover{background:#eaf0fa}
  .btn-reset:disabled{opacity:.45;cursor:default}
  .btn-done{
    background:linear-gradient(135deg,#3ad39b,#18a877);color:#fff;
    box-shadow:0 6px 14px rgba(24,168,119,.28);
  }
  .btn-done .ck{font-size:1.15rem;line-height:1}
  .card.done .btn-done{
    background:#e3f8ee;color:#1c8a64;box-shadow:none;border:1px dashed #9fe3c6;
  }

  .ribbon{
    display:none;position:absolute;top:-11px;left:16px;z-index:3;
    background:linear-gradient(135deg,#5e97ff,#3f6ff6);color:#fff;
    font-size:.74rem;font-weight:900;padding:4px 10px;border-radius:99px;letter-spacing:-.01em;
    box-shadow:0 5px 12px rgba(63,111,246,.32);
  }
  .card.current .ribbon{display:block;animation:bob 1.8s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}

  .star-pop{
    position:absolute;right:18px;top:8px;font-size:1.5rem;pointer-events:none;
    animation:starUp .9s ease-out forwards;z-index:4;
  }
  @keyframes starUp{
    0%{opacity:0;transform:translateY(6px) scale(.6)}
    25%{opacity:1;transform:translateY(-6px) scale(1.15)}
    100%{opacity:0;transform:translateY(-40px) scale(1)}
  }

  /* edit controls (parent mode only) */
  .edit{display:none;grid-template-columns:minmax(0,1fr);gap:8px;padding-top:11px;border-top:1px dashed #dfe7f4}
  body.parent-mode .edit{display:grid}
  .e-row{display:flex;align-items:center;gap:8px;min-width:0;font-size:.8rem;font-weight:800;color:#8593ab}
  .e-row > span:first-child{width:42px;flex:none}
  .e-row input{
    flex:1;min-width:0;border:1px solid #dbe4f1;border-radius:10px;padding:8px 10px;
    font:inherit;font-size:.95rem;font-weight:700;color:var(--ink);background:#f8fbff;
  }
  .e-row input:focus{outline:2px solid #bcd3ff;border-color:#9dc0ff}
  .e-row input.e-min{max-width:88px;font-variant-numeric:tabular-nums}
  .e-row input.e-emoji{max-width:88px;text-align:center}
  .e-row .e-auto{
    flex:1;min-width:0;background:#fff6e9;border:1px dashed #f0d0a0;border-radius:10px;
    padding:8px 10px;font-size:.78rem;font-weight:800;color:#9a6a24;text-align:center;line-height:1.3;
  }
  .e-row .unit{font-size:.8rem;color:#8593ab}
  .e-btns{display:flex;gap:8px}
  .e-btns button{
    flex:1;border:1px solid #dbe4f1;background:#f7faff;border-radius:10px;padding:9px 0;
    font-size:1rem;font-weight:800;color:#45536b;cursor:pointer;touch-action:manipulation;
  }
  .e-btns button:hover{background:#eef4ff}
  .e-btns button.danger{background:#fff3f3;border-color:#ffd6d6;color:#c23a3a}
  .e-btns button.armed{background:#ffe1e1;border-color:#ff9e9e;font-size:.86rem;font-weight:900}

  /* 넓은 화면: 카드를 여러 열로 펼쳐 한 화면에 다 보이게 (패드 세로·작은 노트북 3열) */
  @media (min-width:700px){
    .wrap{max-width:1280px}
    .grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:18px;padding-top:0}
    .card{padding:12px 14px;border-radius:20px;gap:8px}
    .card-head{gap:8px;align-items:center;flex-wrap:wrap}
    .step{width:26px;height:26px;font-size:.8rem;border-radius:9px;order:1}
    .card-head .emoji{font-size:1.32rem;order:2}
    .mins{font-size:.72rem;padding:3px 8px;margin-left:auto;order:3}
    .name{order:4;flex:1 1 100%;font-size:1.04rem;line-height:1.28}
    .timer{gap:8px}
    .timer-time{font-size:1.6rem;min-width:88px}
    .timer-time.wide{font-size:1.15rem;min-width:104px;letter-spacing:-.02em}
    .card.done .timer-time{font-size:1.2rem}
    .timer-bar{height:10px}
    .btn{padding:10px 6px;font-size:.94rem;border-radius:13px;gap:4px}
    .btn-reset{flex:0 0 42px;font-size:1.05rem}
    .btn-done .ck{font-size:1rem}
    .ribbon{top:-13px;left:12px;font-size:.64rem;padding:2px 8px;border-radius:8px}
    /* 위쪽 남은 시간 카드를 낮게: 시간과 상태를 한 줄에, 막대·잔여 정보는 아래에 */
    .cd-card{
      padding:12px clamp(16px,2vw,24px) 10px;border-radius:22px;
      display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:18px;row-gap:4px;
      grid-template-areas:"head head" "time status" "track track" "sub sub";
      align-items:center;
    }
    .cd-head{grid-area:head}
    .cd-label{font-size:1.02rem}
    .target-chip{padding:5px 12px;font-size:.86rem}
    .target-chip b{font-size:.98rem}
    .cd-time{grid-area:time;font-size:clamp(2.5rem,4.4vw,3.2rem);margin:0}
    .cd-time.long{font-size:clamp(2.1rem,3.6vw,2.6rem)}
    .cd-status{grid-area:status;margin:0;padding:6px 11px;font-size:.9rem;border-radius:11px;justify-self:start;align-self:center}
    .cd-track{grid-area:track;margin:4px 0 0;height:10px}
    .cd-sub{grid-area:sub;font-size:.78rem;gap:4px 14px}
    .progress-card{padding:10px 16px;border-radius:20px;margin-top:10px}
    .p-title{font-size:.92rem}
    .p-pct{font-size:1.2rem}
    .progress-track{height:10px;margin:5px 0}
    .p-foot{font-size:.76rem}
  }
  /* 패드 가로(1024×768 등): 4열로 → 스크롤 없이 한 화면 */
  @media (min-width:960px){
    body{padding-bottom:0}
    .wrap{max-width:1280px;padding-top:10px;padding-bottom:10px}
    .topbar{padding-top:7px;padding-bottom:7px}
    .logo{width:42px;height:42px;font-size:23px;border-radius:13px}
    .brand h1{font-size:1.08rem}
    .grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:14px}
  }

  .empty{
    grid-column:1/-1;text-align:center;padding:44px 16px;color:#8493ab;font-weight:800;
    background:#fff;border:2px dashed #dfe8f6;border-radius:24px;line-height:1.7;
  }

  /* ---------- toast ---------- */
  .toast{
    position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom));z-index:90;
    transform:translate(-50%,18px);opacity:0;pointer-events:none;
    background:rgba(30,42,64,.94);color:#fff;font-weight:800;font-size:.96rem;
    padding:13px 20px;border-radius:16px;box-shadow:0 12px 30px rgba(20,30,50,.28);
    transition:opacity .22s,transform .22s;max-width:min(92vw,460px);text-align:center;line-height:1.35;
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}

  /* ---------- celebration ---------- */
  .celebrate{
    position:fixed;inset:0;z-index:70;display:grid;place-items:center;padding:20px;
    background:rgba(22,34,56,.45);-webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px);
    animation:fadeIn .25s ease;
  }
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .celebrate-inner{
    background:#fff;border-radius:30px;padding:26px 24px 22px;max-width:420px;width:100%;
    text-align:center;box-shadow:0 30px 70px rgba(16,26,48,.32);animation:popIn .4s cubic-bezier(.2,1.4,.4,1);
  }
  @keyframes popIn{from{opacity:0;transform:scale(.86) translateY(10px)}to{opacity:1;transform:scale(1) translateY(0)}}
  .celebrate .big{font-size:64px;line-height:1;animation:bounce 1.2s ease-in-out infinite}
  @keyframes bounce{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-10px) rotate(3deg)}}
  .celebrate h2{margin:10px 0 6px;font-size:1.55rem;font-weight:900;letter-spacing:-.02em}
  .celebrate p{margin:0 0 12px;font-size:.98rem;font-weight:800;color:#5d6c88;line-height:1.45}
  .celebrate .stars{font-size:1.3rem;letter-spacing:1px;margin-bottom:16px;line-height:1.5}
  .celebrate button{
    width:100%;border:0;border-radius:16px;padding:15px;font:inherit;font-size:1.05rem;font-weight:900;
    background:linear-gradient(135deg,#4f8dfd,#3f6ff6);color:#fff;cursor:pointer;
    box-shadow:0 10px 22px rgba(63,111,246,.32);touch-action:manipulation;
  }
  .celebrate button:active{transform:scale(.98)}
  #confetti{position:fixed;inset:0;z-index:80;pointer-events:none;display:none}

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.001s !important;animation-iteration-count:1 !important;transition-duration:.001s !important}
  }
  @media print{
    .topbar,.btns,.edit,.toast,#confetti{display:none !important}
    body{background:#fff}
  }
</style>
</head>
<body>
<noscript><p class="noscript">이 화면은 자바스크립트가 켜져 있어야 움직여요. 브라우저 설정에서 자바스크립트를 켜 주세요.</p></noscript>

<header class="topbar">

<div class="wrap">

      <div class="cd-time" id="cdTime">--:--<small id="cdUnit">남음</small></div>
      <div class="cd-status" id="cdStatus">⏳ 시간을 계산하고 있어요</div>

      <span class="p-pct" id="progPct">0%</span>

      <div class="progress-fill" id="progFill"></div>

    <div class="p-foot">
      <span id="nowTask">👉 지금 차례를 찾는 중…</span>

  <section class="parent-panel" id="parentPanel" hidden aria-label="엄마 설정">
    <div class="pp-head">

    </div>
    <div class="pp-targets-head"><span id="targetFieldLabel">요일별 목표 시간</span></div>
    <div class="pp-targets" role="group" aria-label="요일별 목표 시간">
      <label class="tg" data-group="monThu">
        <span class="tg-top"><span class="tg-name">🎒 월~목</span><span class="tg-badge" hidden>오늘</span></span>
        <input type="time" data-target-group="monThu" value="08:00" step="60" aria-label="월~목 목표 시간">

      </label>
      <label class="tg" data-group="fri">
        <span class="tg-top"><span class="tg-name">🎒 금</span><span class="tg-badge" hidden>오늘</span></span>
        <input type="time" data-target-group="fri" value="08:35" step="60" aria-label="금요일 목표 시간">
        <span class="tg-sub">등원 출발</span>

        <input type="time" data-target-group="sun" value="08:20" step="60" aria-label="일요일 목표 시간">
        <span class="tg-sub">주말 미션</span>

    </div>
    <div class="pp-grid">
      <div class="field">할 일 목록
        <button class="btn-soft" id="addTask" type="button">＋ 할 일 추가하기</button>
      </div>

    <p class="pp-mode" id="ppModeNote"></p>
    <div class="pp-actions">
      <button class="btn-soft" id="resetToday" type="button">↺ 오늘 체크 초기화</button>
      <button class="btn-soft" id="restoreDefaults" type="button">기본 목록으로 되돌리기</button>
      <button class="btn-soft" id="testSound" type="button" title="타이머가 끝날 때 나는 소리를 미리 들어보기">🔔 소리 테스트</button>
      <button class="btn-soft" id="autoModeBtn" type="button">🔄 요일대로 자동</button>

    <p class="pp-note">카드마다 이름·시간·이모지를 고치고 ▲▼로 순서를 바꾸거나 🗑로 지울 수 있어요. 아이가 쓰는 동안에는 이 설정을 닫아 두세요.</p>
  </section>

  <main class="grid" id="grid" aria-label="아침 루틴 할 일 목록"></main>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<div class="celebrate" id="celebrate" hidden role="dialog" aria-modal="true" aria-labelledby="celebrateTitle">

<script>
(function(){
  'use strict';

  /* ================= constants & utils ================= */
  const STORAGE_KEY = 'morningRoutineDashboard.v1';
  /* 목표 시간은 요일 묶음마다 다르다: 월~목 08:00 · 금 08:35 · 토 08:30 · 일 08:20 */
  const DEFAULT_TARGETS = { monThu:'08:00', fri:'08:35', sat:'08:30', sun:'08:20' };
  const TARGET_KEYS = ['monThu', 'fri', 'sat', 'sun'];
  /* 엄마 설정에 보여 주는 순서와 이름 */
  const TARGET_GROUPS = [
    { key:'monThu', label:'월~목', days:'월·화·수·목요일', emoji:'🎒', targetName:'등원 출발' },
    { key:'fri',    label:'금',    days:'금요일',        emoji:'🎒', targetName:'등원 출발' },
    { key:'sat',    label:'토',    days:'토요일',        emoji:'🌈', targetName:'주말 미션' },
    { key:'sun',    label:'일',    days:'일요일',        emoji:'🌈', targetName:'주말 미션' }
  ];
  /* v5까지 쓰던 모드별 기본 목표 시간 — 마이그레이션할 때 '직접 고친 값인지'를 가릴 때만 쓴다. */
  const OLD_TARGET_WEEKDAY = '08:00';
  const OLD_TARGET_WEEKEND = '10:00';
  /* 저장 형식 버전: v4부터 평일/주말 모드의 목록·오늘 체크를 따로 저장하고,
     v5부터 마지막에 '🎲 놀기'(목표 시간에서 남는 시간 자동 계산) 단계가 붙고,
     v6부터 목표 시간을 요일 묶음(월~목 / 금 / 토 / 일)별로 저장하고,
     v7부터 주말 목록의 '리딩게이트 하기' 다음에 '눈높이 국어'(10분)가 들어간다.
     v8부터 평일 아침을 '아침밥 준비 · 물병 챙기기 · 가방 싸기'(15분) + '아침밥 먹기'(15분)로 나누고,
     '🎲 놀기'가 목표 3분 전에 끝나고 그 뒤에 '아이패드 · 이어폰 · 숙제가방 싸기'(3분)가 붙는다. */
  const SCHEMA_V = 8;
  /* '놀기': 시간을 정하지 않고 목표 시간까지 남는 시간이 저절로 계산된다(마지막 3분은 싸기 시간으로 남긴다). */
  const PLAY_TASK = { emoji:'🎲', name:'놀기', autoRemaining:true };
  /* 목표 3분 전에 놀이를 끝내고, 그 3분 동안 아이패드·이어폰·숙제가방을 챙긴다. */
  const PACK_TAIL_MINUTES = 3;
  const PACK_TAIL_SECONDS = PACK_TAIL_MINUTES * 60;
  const FINAL_PACK_TASK = { emoji:'🎒', name:'아이패드 · 이어폰 · 숙제가방 싸기', minutes:PACK_TAIL_MINUTES };
  /* 평일 모드 기본 목록의 고정 할 일 (8단계 · 73분 · 맨 끝에 '놀기' + '숙제가방 싸기') */
  const BASE_WEEKDAY_TASKS = [
    { emoji:'💊', name:'일어나서 약 먹기', minutes:5 },
    { emoji:'🚿', name:'샤워 · 옷+양말 · 로션 · 머리 말리기', minutes:15 },
    { emoji:'🍱', name:'아침밥 준비 · 물병 챙기기 · 가방 싸기', minutes:15 },
    { emoji:'🍚', name:'아침밥 먹기', minutes:15 },
    { emoji:'💊', name:'식후 약 먹기', minutes:5 },
    { emoji:'🪥', name:'이 닦기', minutes:5 },
    { emoji:'📚', name:'리딩게이트 하기', minutes:10 }
  ];
  /* 주말 모드 기본 목록의 고정 할 일 (7단계 · 95분 · 가방 싸기 없음 · 리딩게이트 25분 · 눈높이 국어 10분) */
  const BASE_WEEKEND_TASKS = [
    { emoji:'💊', name:'일어나서 약 먹기', minutes:5 },
    { emoji:'🚿', name:'샤워 · 옷+양말 · 로션 · 머리 말리기', minutes:15 },

  }

  /* v7: 주말 목록의 '리딩게이트 하기' 바로 다음에 '눈높이 국어'(10분)를 넣는다.
     손수 고친 주말 목록·오늘 체크·타이머는 그대로 두고, 이미 '눈높이 국어'가 있으면 건드리지 않는다.
     (리딩게이트가 없으면 고정 할 일 끝, 즉 맨 마지막 '🎲 놀기' 앞에 넣는다.) */
  function ensureKoreanTask(block){
    if(!block || !Array.isArray(block.tasks)) return;
    if(!block.timers || typeof block.timers !== 'object') block.timers = {};
    var exists = block.tasks.some(function(t){ return normName(t && t.name).indexOf('눈높이국어') >= 0; });
    if(exists) return;
    var task = { id: newId('w'), emoji: KOREAN_TASK.emoji, name: KOREAN_TASK.name, minutes: KOREAN_TASK.minutes };
    var at = -1;
    for(var i = 0; i < block.tasks.length; i++){
      if(normName(block.tasks[i] && block.tasks[i].name).indexOf('리딩게이트') >= 0){ at = i + 1; break; }
    }
    if(at < 0){
      for(var j = 0; j < block.tasks.length; j++){
        if(isAuto(block.tasks[j])){ at = j; break; }
      }
    }
    if(at < 0) at = block.tasks.length;
    block.tasks.splice(at, 0, task);
    block.timers[task.id] = freshTimer(task);
  }

  /* v8: '아침상 차리기 · 아침 식사'를 25분 → 30분으로 늘린다.
     고운 님이 직접 넣은 할 일(예: 국어 쓰기노트)·오늘 체크·다른 할 일의 시간은 그대로 두고
     아침 시간만 30분으로 맞춘다. 타이머는 아직 쓰지 않았으면 30분으로 채우고,
     이미 돌고 있거나 줄어든 타이머는 30분을 넘지 않게만 맞춘다(남은 시간을 늘려 주지 않는다). */
  function ensureBreakfastMinutes(block){
    if(!block || !Array.isArray(block.tasks)) return;
    if(!block.timers || typeof block.timers !== 'object') block.timers = {};
    block.tasks.forEach(function(t){
      if(!t || t.autoRemaining) return;
      if(normName(t.name) !== BREAKFAST_NAME) return;
      var oldFull = (typeof t.minutes === 'number' ? t.minutes : 0) * 60;
      var newFull = BREAKFAST_MINUTES * 60;
      t.minutes = BREAKFAST_MINUTES;
      var tm = block.timers[t.id];
      if(!tm || typeof tm !== 'object'){ tm = block.timers[t.id] = freshTimer(t); return; }
      if(!tm.endAt && tm.left >= oldFull) tm.left = newFull;      /* 아직 손대지 않은 타이머 */
      else if(tm.left > newFull) tm.left = newFull;
      if(!(tm.span > 0) || tm.span === oldFull || tm.span > newFull) tm.span = newFull;
    });
  }

  /* v8(평일): 아침을 두 단계로 나누고, 맨 끝에 '숙제가방 싸기'를 붙인다.
     · '아침상 차리기 · 아침 식사' → '아침밥 준비 · 물병 챙기기 · 가방 싸기'(15분) + '아침밥 먹기'(15분)
     · 따로 있던 '가방 싸기'는 준비 단계에 합쳤으니 뺀다
     · '리딩게이트 하기'는 15분 → 10분(직접 고친 시간은 그대로)
     · 맨 끝 '🎲 놀기' 다음에 '아이패드 · 이어폰 · 숙제가방 싸기'(3분)
     직접 넣은 할 일(예: 국어 쓰기노트)·오늘 체크·다른 시간은 그대로 둔다. */
  function migrateWeekdayV8(block){
    if(!block || !Array.isArray(block.tasks)) return;
    var tasks = block.tasks;
    if(!block.done || typeof block.done !== 'object') block.done = {};
    if(!block.timers || typeof block.timers !== 'object') block.timers = {};
    var i, k;

    /* 1) 아침을 준비/먹기 두 단계로 나눈다(이미 나뉘어 있으면 건드리지 않는다). */
    var hasSplit = tasks.some(function(t){ return normName(t && t.name).indexOf('아침밥준비') >= 0; });
    if(!hasSplit){
      var bi = -1;
      for(i = 0; i < tasks.length; i++){
        if(normName(tasks[i] && tasks[i].name) === BREAKFAST_NAME){ bi = i; break; }
      }
      if(bi >= 0){
        var old = tasks[bi];
        var wasDone = !!block.done[old.id];
        var prep = { id: newId('d'), emoji: PREP_TASK.emoji, name: PREP_TASK.name, minutes: PREP_TASK.minutes };
        var eat  = { id: newId('d'), emoji: EAT_TASK.emoji,  name: EAT_TASK.name,  minutes: EAT_TASK.minutes };
        tasks.splice(bi, 1, prep, eat);
        delete block.done[old.id];
        delete block.timers[old.id];
        if(wasDone){ block.done[prep.id] = true; block.done[eat.id] = true; }
        block.timers[prep.id] = { left: wasDone ? 0 : PREP_TASK.minutes * 60, endAt: null, span: PREP_TASK.minutes * 60 };
        block.timers[eat.id]  = { left: wasDone ? 0 : EAT_TASK.minutes * 60,  endAt: null, span: EAT_TASK.minutes * 60 };
      }
    }

    /* 2) 따로 있던 '가방 싸기'는 준비 단계에 들어갔으니 뺀다. */
    for(k = tasks.length - 1; k >= 0; k--){
      if(normName(tasks[k] && tasks[k].name) === '가방싸기'){
        delete block.done[tasks[k].id];
        delete block.timers[tasks[k].id];
        tasks.splice(k, 1);
      }
    }

    /* 3) '리딩게이트 하기' 15분 → 10분 */
    tasks.forEach(function(t){
      if(!t || t.autoRemaining) return;
      if(normName(t.name) !== '리딩게이트하기' || t.minutes !== 15) return;
      t.minutes = 10;
      var tm = block.timers[t.id];
      if(!tm || typeof tm !== 'object'){ block.timers[t.id] = freshTimer(t); return; }
      if(!tm.endAt && tm.left >= 900) tm.left = 600;
      else if(tm.left > 600) tm.left = 600;
      if(!(tm.span > 0) || tm.span === 900 || tm.span > 600) tm.span = 600;
    });

    /* 4) 맨 끝 '🎲 놀기' 다음에 '아이패드 · 이어폰 · 숙제가방 싸기'(3분) */
    var hasPack = tasks.some(function(t){ return normName(t && t.name).indexOf('숙제가방') >= 0; });
    if(!hasPack){
      var pack = { id: newId('d'), emoji: FINAL_PACK_TASK.emoji, name: FINAL_PACK_TASK.name, minutes: FINAL_PACK_TASK.minutes };
      var pi = -1;
      for(i = 0; i < tasks.length; i++){ if(isAuto(tasks[i])){ pi = i; break; } }
      if(pi >= 0) tasks.splice(pi + 1, 0, pack); else tasks.push(pack);
      block.timers[pack.id] = { left: FINAL_PACK_TASK.minutes * 60, endAt: null, span: FINAL_PACK_TASK.minutes * 60 };
    }

    /* 5) 새로 생긴 할 일의 타이머가 비어 있지 않게 */
    tasks.forEach(function(t){ if(t && !block.timers[t.id]) block.timers[t.id] = freshTimer(t); });
  }

  /* v4까지의 기본 시간 → 지금 기본 시간.
     저장된 시간이 '그때 기본값'과 똑같을 때만 바꾸고, 직접 고친 시간은 그대로 둔다. */
  const V4_MINUTES_FIX = {
    '일어나서약먹기': { from:2, to:5 },
    '샤워·옷+양말·로션·머리말리기': { from:20, to:15 },
    '식후약먹기': { from:2, to:5 }
  };
  function migrateDurations(block, fromV, isWeekend){
    if(!block || !Array.isArray(block.tasks) || fromV >= 5) return;
    block.tasks.forEach(function(t){
      if(t.autoRemaining) return;
      var key = normName(t.name);
      var fix = V4_MINUTES_FIX[key] || null;
      if(key === '리딩게이트하기') fix = isWeekend ? { from:15, to:25 } : null;
      if(!fix || t.minutes !== fix.from) return;
      var oldFull = fix.from * 60;
      var newFull = fix.to * 60;
      t.minutes = fix.to;
      var tm = block.timers && block.timers[t.id];
      if(tm){
        if(!tm.endAt && tm.left >= oldFull) tm.left = newFull;  /* 아직 손대지 않은 타이머 */
        else if(tm.left > newFull) tm.left = newFull;
        tm.span = newFull;
      }
    });
  }

  function normalize(s){
    if(!s || typeof s !== 'object') return freshState();
    var fromV = (typeof s.v === 'number' && isFinite(s.v)) ? s.v : 1;
    var legacy = { weekday: null, weekend: null };
    if(fromV < 4 || !s.modes || typeof s.modes !== 'object'){
      s = migrateLegacy(s);
      legacy = {
        weekday: (s.modes && s.modes.weekday && timeOk(s.modes.weekday.target)) ? s.modes.weekday.target : null,
        weekend: (s.modes && s.modes.weekend && timeOk(s.modes.weekend.target)) ? s.modes.weekend.target : null
      };
    } else {
      legacy = {
        weekday: (s.modes.weekday && timeOk(s.modes.weekday.target)) ? s.modes.weekday.target : null,
        weekend: (s.modes.weekend && timeOk(s.modes.weekend.target)) ? s.modes.weekend.target : null
      };
    }
    s.modes = {
      weekday: normBlock(s.modes && s.modes.weekday, DEFAULT_WEEKDAY_TASKS, 'd'),
      weekend: normBlock(s.modes && s.modes.weekend, DEFAULT_WEEKEND_TASKS, 'w')
    };
    /* v4 이하 저장값: 바뀐 기본 시간을 반영하고, 두 모드 끝에 '🎲 놀기'를 붙인다.
       v5부터는 지운 건 지운 채로, 고친 건 고친 채로 둔다. */
    if(fromV < 5){
      migrateDurations(s.modes.weekday, fromV, false);
      migrateDurations(s.modes.weekend, fromV, true);
      ensurePlayTask(s.modes.weekday, 'd');
      ensurePlayTask(s.modes.weekend, 'w');
      if(s.modes.weekday && s.modes.weekday.timers) s.modes.weekday.timers = normalizeTimers(s.modes.weekday.tasks, s.modes.weekday.timers);
      if(s.modes.weekend && s.modes.weekend.timers) s.modes.weekend.timers = normalizeTimers(s.modes.weekend.tasks, s.modes.weekend.timers);
    }
    delete s.tasks;
    delete s.done;
    delete s.timers;
    /* v7: 이미 저장해 둔 주말 목록에도 '리딩게이트 하기' 다음에 '눈높이 국어'를 넣는다.
       (평일 목록은 그대로 두고, 오늘/내일 체크와 타이머도 건드리지 않는다.) */
    if(fromV < 7){
      ensureKoreanTask(s.modes.weekend);
    }
    /* v8: 두 모드 모두 '아침상 차리기 · 아침 식사'를 30분으로 맞춘다.
       손수 고친 할 일·오늘 체크·다른 시간·목표 시간은 건드리지 않는다. */
    if(fromV < 8){
      ensureBreakfastMinutes(s.modes.weekday);
      migrateWeekdayV8(s.modes.weekday);
      ensureBreakfastMinutes(s.modes.weekend);   /* 주말 아침 25분 → 30분 */
    }
    /* v6: 목표 시간은 요일 묶음별로 따로 보관한다. */
    s.targets = normalizeTargets(s.targets, legacy);
    s.settings = Object.assign({}, (s.settings && typeof s.settings === 'object') ? s.settings : {});
    delete s.settings.target;
    s.settings.sound = s.settings.sound !== false;
    s.stats = Object.assign({ streak:0, lastAllDone:null, celebrated:null }, (s.stats && typeof s.stats === 'object') ? s.stats : {});
    s.history = (s.history && typeof s.history === 'object') ? s.history : {};
    s.date = (typeof s.date === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s.date)) ? s.date : dateKey(new Date());
    s.modePref = (s.modePref && typeof s.modePref === 'object' && (s.modePref.mode === 'weekday' || s.modePref.mode === 'weekend') && /^\d{4}-\d{2}-\d{2}$/.test(String(s.modePref.date)))
      ? { date: String(s.modePref.date), mode: s.modePref.mode }
      : null;
    /* 저장된 모드는 그 날짜의 모드다. 날짜가 바뀌었으면 날짜가 넘어갈 때(rollover)
       어제 기록을 남긴 뒤에 오늘 모드로 바꿔 준다. */
    s.mode = (s.mode === 'weekday' || s.mode === 'weekend') ? s.mode : resolveMode(s);
    var act = s.modes[s.mode];
    if(s.runningId && !act.timers[s.runningId]) s.runningId = null;
    s.v = SCHEMA_V;
    return s;
  }

  function loadState(){
    var raw = null;
    try { raw = localStorage.getItem(STORAGE_KEY); } catch(e){ raw = null; }
    var parsed = null;
    if(raw){ try { parsed = JSON.parse(raw); } catch(e){ parsed = null; } }
    return normalize(parsed);
  }

  function save(){
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e){ /* 저장 불가 환경 */ }
    lastSave = Date.now();
  }

  function rolloverIfNeeded(){
    var today = dateKey(new Date());
    if(state.date === today){
      var want = resolveMode(state);
      if(state.mode !== want) state.mode = want;
      return false;
    }
    var act = state.modes[state.mode];
    var doneN = Object.keys(act.done).filter(function(k){ return act.done[k]; }).length;
    if(state.date && doneN > 0){
      state.history[state.date] = { done: doneN, total: act.tasks.length, mode: state.mode };
    }
    state.date = today;
    state.modePref = null;
    state.runningId = null;
    MODE_KEYS.forEach(function(k){
      var b = state.modes[k];
      b.done = {};
      b.timers = {};
      b.tasks.forEach(function(t){ b.timers[t.id] = freshTimer(t); });
    });
    state.mode = autoMode(new Date());
    if(state.stats.celebrated && state.stats.celebrated !== today) state.stats.celebrated = null;
    var y = yesterdayKey();
    if(state.stats.lastAllDone && state.stats.lastAllDone !== y && state.stats.lastAllDone !== today){
      state.stats.streak = 0;
    }
    save();
    return true;
  }

  /* ================= derived ================= */
  /* '🎲 놀기'처럼 시간을 정하지 않고 목표 시간에서 남는 시간을 쓰는 단계인지 */
  function isAuto(t){ return !!(t && t.autoRemaining); }
  function autoTask(){
    var list = M().tasks;
    for(var i = 0; i < list.length; i++){ if(isAuto(list[i])) return list[i]; }
    return null;
  }
  function doneCount(){
    return M().tasks.filter(function(t){ return !!M().done[t.id]; }).length;
  }
  /* 보통 할 일(놀기 제외)만 — '남은 할 일'·'예상 완료'는 이걸로 센다. */
  function regularTasks(){
    return M().tasks.filter(function(t){ return !isAuto(t); });
  }
  function regularDoneCount(){
    return regularTasks().filter(function(t){ return !!M().done[t.id]; }).length;
  }
  function totalStars(){
    var n = 0;
    Object.keys(state.history).forEach(function(k){ n += (state.history[k] && state.history[k].done) || 0; });
    return n + doneCount();
  }
  function nowSecondsOfDay(){
    var d = new Date();
    return d.getHours()*3600 + d.getMinutes()*60 + d.getSeconds();
  }
  /* 오늘 목표 시간까지 남은 초(지났으면 음수) */
  function secsUntilTarget(){
    var tp = targetParts();
    return (tp.h*3600 + tp.m*60) - nowSecondsOfDay();
  }
  /* 보통 할 일이 아직 쓰지 않은 시간(초) */
  function otherRemainingSeconds(){
    var list = M().tasks, pi = playIndex(list), s = 0;
    list.forEach(function(t, i){
      if(isAuto(t) || M().done[t.id]) return;
      if(pi >= 0 && i > pi) return;   /* 놀기 뒤 단계(마지막 숙제가방 싸기)는 따로 센다 */
      s += taskLeftSeconds(t);
    });
    return s;
  }
  /* 목록에서 '🎲 놀기'가 몇 번째인지(없으면 -1) */
  function playIndex(list){
    list = list || M().tasks;
    for(var i = 0; i < list.length; i++){ if(isAuto(list[i])) return i; }
    return -1;
  }
  /* 놀기 뒤에 오는 마지막 '숙제가방 싸기'에 비워 둘 시간 — 놀이가 목표 3분 전에 끝나게 한다.
     (주말처럼 놀기 뒤에 싸기 단계가 없으면 0) */
  function packTailSeconds(){
    var list = M().tasks, pi = playIndex(list);
    if(pi < 0) return 0;
    for(var i = pi + 1; i < list.length; i++){
      var t = list[i];
      if(!t || isAuto(t) || M().done[t.id]) continue;
      if(normName(t.name).indexOf('숙제가방') >= 0) return Math.min(PACK_TAIL_SECONDS, taskLeftSeconds(t));
    }
    return 0;
  }
  /* 목록 맨 끝에 '숙제가방 싸기'가 있는지(평일만) */
  function hasFinalPack(){
    var list = M().tasks;
    for(var i = 0; i < list.length; i++){
      if(normName(list[i].name).indexOf('숙제가방') >= 0) return true;
    }
    return false;
  }
  /* 목표 시간까지 남은 시간에서 마지막 싸기 시간과 다른 할 일에 쓸 시간을 뺀 '남는 놀 시간'.
     모두 제때 끝나면 놀이는 목표 3분 전에 00:00이 되고, 그다음 '숙제가방 싸기' 3분이 시작된다. */
  function playAutoSeconds(){
    var until = secsUntilTarget();
    if(until < 0) until = 0;
    return Math.max(0, until - packTailSeconds() - otherRemainingSeconds());
  }
  function taskLeftSeconds(t){
    if(isAuto(t)){
      var at = M().timers[t.id];
      if(at && at.endAt) return Math.max(0, (at.endAt - Date.now()) / 1000);
      return playAutoSeconds();
    }
    var tm = M().timers[t.id];
    var full = t.minutes * 60;
    if(!tm) return full;
    var left = tm.endAt ? Math.max(0, (tm.endAt - Date.now()) / 1000) : Math.max(0, tm.left);
    return Math.min(full, left);
  }
  /* 보통 할 일의 남은 시간 합계(초) — 놀기는 빼고 센다. */
  function remainingTaskSeconds(){
    var s = 0;
    M().tasks.forEach(function(t){
      if(isAuto(t) || M().done[t.id]) return;
      s += taskLeftSeconds(t);
    });
    return Math.round(s);
  }
  function targetParts(){
    var p = String(activeTarget()).split(':');
    return { h: parseInt(p[0], 10) || 0, m: parseInt(p[1], 10) || 0 };
  }

  /* ================= audio ================= */
  /* 아이패드·아이폰 사파리는 '사용자가 직접 누른 순간'이 지나면 오디오를 잠가 버린다.
     타이머가 00:00이 되는 순간은 사용자 동작이 아니어서, Web Audio 하나만 믿으면 그때 조용해졌다.
     그래서 두 갈래를 모두 미리 준비해 둔다.
       ① 화면을 처음 누를 때 미리 열어 둔 HTML5 <audio> — 메모리에서 구운 WAV 차임 (주 경로)
       ② Web Audio(AudioContext) — ①이 막혔을 때의 대비 경로
     둘 다 열어 두고, 울릴 때는 한쪽만 쓴다(같이 울려 두 번 들리지 않게). */
  var actx = null, audioUnlocked = false, keepAlive = null;
  var alarmEl = null, popEl = null, fanEl = null, silentEl = null;
  var WAV_RATE = 22050;

  /* 16bit 모노 PCM WAV를 메모리에서 구워 data URI로 돌려준다(소리 파일 없이 합성). */
  function wavDataUri(samples, rate){
    rate = rate || WAV_RATE;
    var n = samples.length, bytes = 44 + n * 2;
    var buf = new ArrayBuffer(bytes), v = new DataView(buf);
    function tag(off, s){ for(var i = 0; i < s.length; i++) v.setUint8(off + i, s.charCodeAt(i)); }
    tag(0, 'RIFF'); v.setUint32(4, bytes - 8, true); tag(8, 'WAVE');
    tag(12, 'fmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
    v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
    tag(36, 'data'); v.setUint32(40, n * 2, true);
    for(var i2 = 0; i2 < n; i2++){
      var s2 = Math.max(-1, Math.min(1, samples[i2]));
      v.setInt16(44 + i2 * 2, Math.round(s2 < 0 ? s2 * 0x8000 : s2 * 0x7fff), true);
    }
    var u8 = new Uint8Array(buf), bin = '';
    for(var k = 0; k < u8.length; k += 0x8000){
      bin += String.fromCharCode.apply(null, u8.subarray(k, Math.min(k + 0x8000, u8.length)));
    }
    return 'data:audio/wav;base64,' + btoa(bin);
  }

  /* 종소리(배음 2·3)를 얹은 음들을 시간축에 놓아 하나의 소리로 굽는다. */
  function bellWav(notes, total){
    var rate = WAV_RATE, n = Math.ceil(total * rate), out = new Float32Array(n), peak = 0, i, j, m;
    notes.forEach(function(nt){
      var start = Math.round(nt.t * rate), len = Math.round(nt.dur * rate), f = nt.f, vol = nt.v || 0.5;
      for(i = 0; i < len; i++){
        var idx = start + i;
        if(idx >= n) break;
        if(idx < 0) continue;
        var tt = i / rate;
        var env = Math.exp(-tt * 2.6) * (1 - Math.exp(-tt * 220));
        var s = Math.sin(6.283185307 * f * tt) + 0.34 * Math.sin(6.283185307 * f * 2 * tt) + 0.14 * Math.sin(6.283185307 * f * 3 * tt);
        out[idx] += s * env * vol;
      }
    });
    for(j = 0; j < n; j++){ var a = out[j] < 0 ? -out[j] : out[j]; if(a > peak) peak = a; }
    var g = peak > 0 ? 0.9 / peak : 1;
    var tail = Math.max(1, Math.round(rate * 0.04));   /* 끝에서 뚝 끊기지 않게 40ms 페이드아웃 */
    for(m = 0; m < n; m++){
      out[m] *= g;
      if(m > n - tail) out[m] *= (n - m) / tail;
    }
    return wavDataUri(out, rate);
  }

  var wavCache = {};
  function soundUrl(kind){
    if(wavCache[kind]) return wavCache[kind];
    var url;
    if(kind === 'alarm'){
      /* 할 일이 끝났을 때: 도-미-솔 종소리를 두 번 또렷하게 (아이도 엄마도 듣도록) */
      var notes = [];
      [0, 1.35].forEach(function(off){
        [523.25, 659.25, 783.99].forEach(function(f, i){
          notes.push({ f: f, t: off + i * 0.19, dur: 1.3, v: 0.62 });
        });
      });
      url = bellWav(notes, 2.95);
    } else if(kind === 'fanfare'){
      var ns = [];
      [523.25, 659.25, 783.99, 1046.5, 1318.51].forEach(function(f, i){
        ns.push({ f: f, t: i * 0.14, dur: 1.0, v: 0.42 });
      });
      url = bellWav(ns, 1.9);
    } else {
      /* pop: '✓ 됐어요!'를 눌렀을 때 나는 짧고 밝은 두 음 */
      url = bellWav([
        { f: 1046.5, t: 0,    dur: 0.4,  v: 0.42 },
        { f: 1567.98, t: 0.09, dur: 0.55, v: 0.32 }
      ], 0.75);
    }
    wavCache[kind] = url;
    return url;
  }

  /* 실제로 울릴 <audio> 요소들 (화면 밖에 두고 미리 열어 둔다) */
  function makeAudioEl(url){
    var a = document.createElement('audio');
    a.preload = 'auto';
    a.setAttribute('playsinline', '');
    a.setAttribute('aria-hidden', 'true');
    a.style.cssText = 'position:absolute;left:-9999px;width:1px;height:1px;opacity:0;pointer-events:none;';
    a.src = url;
    a.addEventListener('ended', function(){ a.__real = false; });
    (document.body || document.documentElement).appendChild(a);
    return a;
  }
  function buildAudioEls(){
    if(alarmEl) return;
    try {
      alarmEl  = makeAudioEl(soundUrl('alarm'));
      popEl    = makeAudioEl(soundUrl('pop'));
      fanEl    = makeAudioEl(soundUrl('fanfare'));
      silentEl = makeAudioEl(wavDataUri(new Float32Array(Math.ceil(WAV_RATE * 0.1)), WAV_RATE));
    } catch(e){ alarmEl = popEl = fanEl = silentEl = null; }
  }

  /* Web Audio를 깨우고, 조용한 발진기로 계속 살려 둔다(사파리가 컨텍스트를 재우지 않도록). */
  function ensureAudio(){
    try {
      if(!actx){
        var AC = window.AudioContext || window.webkitAudioContext;
        if(!AC) return null;
        actx = new AC();
      }
      if(actx.state === 'suspended' && actx.resume){
        var p = actx.resume();
        if(p && p.catch) p.catch(function(){});
      }
      if(actx.state === 'running'){
        if(!audioUnlocked){
          var buf = actx.createBuffer(1, 1, 22050);
          var src = actx.createBufferSource();
          src.buffer = buf; src.connect(actx.destination);
          if(src.start) src.start(0);
          audioUnlocked = true;
        }
        if(!keepAlive){
          try {
            var ka = actx.createOscillator(), kg = actx.createGain();
            kg.gain.value = 0.00001;
            ka.frequency.value = 30;
            ka.connect(kg); kg.connect(actx.destination);
            if(ka.start) ka.start(0);
            keepAlive = ka;
          } catch(e){}
        }
      }
      return actx;
    } catch(e){ actx = null; return null; }
  }

  function playNote(freq, delay, dur, type, vol){
    if(!actx) return;
    try {
      var o = actx.createOscillator();
      var g = actx.createGain();
      var t0 = actx.currentTime + delay;
      o.type = type || 'sine';
      o.frequency.value = freq;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(vol || 0.16, t0 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g);
      g.connect(actx.destination);
      o.start(t0);
      o.stop(t0 + dur + 0.06);
    } catch(e){ /* ignore */ }
  }
  /* 종소리처럼 배음을 더한 음 하나 */
  function bell(freq, delay, dur, vol){
    playNote(freq, delay, dur, 'sine', vol);
    playNote(freq * 2, delay, dur * 0.55, 'sine', vol * 0.32);
    playNote(freq * 3, delay, dur * 0.3, 'triangle', vol * 0.13);
  }

  function webNotes(kind){
    if(!actx) return;
    if(kind === 'alarm'){
      /* 할 일이 끝났을 때: 도-미-솔을 두 번 또렷하게 */
      [0, 1.35].forEach(function(offset){
        [523.25, 659.25, 783.99].forEach(function(f, i){ bell(f, offset + i * 0.19, 1.1, 0.26); });
      });
    } else if(kind === 'pop'){
      playNote(1046.5, 0,    0.16, 'triangle', 0.13);
      playNote(1567.98, 0.07, 0.24, 'triangle', 0.11);
      playNote(2093, 0.14, 0.24, 'sine', 0.07);
    } else if(kind === 'fanfare'){
      [523.25, 659.25, 783.99, 1046.5, 1318.51].forEach(function(f, i){
        bell(f, i*0.13, 0.6, 0.17);
      });
    } else if(kind === 'undo'){
      playNote(659.25, 0, 0.16, 'sine', 0.09);
      playNote(523.25, 0.08, 0.2, 'sine', 0.08);
    }
  }

  /* 멈춰 있으면 resume()를 기다렸다가 울린다(멈춘 채로 음을 예약하면 소리가 안 난다). */
  function webChime(kind){
    var ctx = ensureAudio();
    if(!ctx) return;
    if(ctx.state === 'running'){ webNotes(kind); return; }
    if(ctx.resume){
      try {
        var p = ctx.resume();
        if(p && p.then) p.then(function(){ if(actx && actx.state === 'running') webNotes(kind); }).catch(function(){});
      } catch(e){}
    }
  }

  /* 요소를 '사용자가 연 요소'로 만들어 둔다: 소리 없이(muted) 한 번 재생했다 멈춘다. */
  function primeElement(el){
    if(!el || el.__primed || el.__real) return;
    try {
      el.muted = true;
      el.currentTime = 0;
      var p = el.play();
      var fin = function(){
        try { if(!el.__real){ el.pause(); el.currentTime = 0; } } catch(e){}
        el.muted = false;
        el.__primed = true;
      };
      if(p && p.then) p.then(fin).catch(function(){ el.muted = false; });
      else fin();
    } catch(e){ try { el.muted = false; } catch(e2){} }
  }

  /* 화면을 누를 때마다 부른다: 두 갈래 오디오를 모두 '이 페이지에서 열린' 상태로 유지. */
  function unlockAudio(){
    buildAudioEls();
    ensureAudio();
    if(silentEl){
      try {
        silentEl.muted = false;
        silentEl.volume = 1;
        silentEl.currentTime = 0;
        var p = silentEl.play();          /* 0 PCM, 진짜 무음이라 들리지 않는다 */
        if(p && p.then) p.then(function(){ try { silentEl.pause(); silentEl.currentTime = 0; } catch(e){} }).catch(function(){});
      } catch(e){}
    }
    primeElement(alarmEl);
    primeElement(popEl);
    primeElement(fanEl);
  }

  /* 미리 열어 둔 <audio>로 울린다. 막히면(reject) Web Audio로 대신 울린다. */
  function playElement(kind){
    var el = kind === 'alarm' ? alarmEl : (kind === 'fanfare' ? fanEl : popEl);
    if(!el) return false;
    try {
      el.muted = false;
      el.__real = true;
      el.currentTime = 0;
      var p = el.play();
      if(p && p.catch) p.catch(function(){ el.__real = false; webChime(kind); });
      return true;
    } catch(e){ el.__real = false; return false; }
  }

  function playChime(kind){
    if(!state.settings.sound) return;
    buildAudioEls();
    if(playElement(kind)) return;   /* ① 미리 열어 둔 <audio>가 먼저 */
    webChime(kind);                 /* ② 안 되면 Web Audio */
  }
  function chime(kind){ playChime(kind); }   /* 부르는 곳은 예전 이름 그대로 */

  /* ================= rendering ================= */
  function renderClock(now){
    setText($('#nowTime'), pad(now.getHours()) + ':' + pad(now.getMinutes()));
    setText($('#nowSec'), pad(now.getSeconds()));
    var label = (now.getMonth()+1) + '월 ' + now.getDate() + '일 ' + WEEKDAYS[now.getDay()] + '요일';
    setText($('#dateLabel'), label);
  }

  function renderGrid(){
    var grid = $('#grid');
    if(!M().tasks.length){
      grid.innerHTML = '<div class="empty">아직 할 일이 없어요.<br>👩 엄마 설정에서 할 일을 추가해 주세요 🐣</div>';
      cards = new Map();
      return;
    }
    var hasPack = hasFinalPack();
    var html = M().tasks.map(function(t, i){
      var bg = STEP_BG[i % STEP_BG.length];
      var ink = STEP_INK[i % STEP_INK.length];
      var auto = isAuto(t);
      var tm = M().timers[t.id] || freshTimer(t);
      var Left = auto ? taskLeftSeconds(t) : (tm.endAt ? Math.max(0, (tm.endAt - Date.now())/1000) : Math.max(0, tm.left));
      var minField = auto
        ? '<div class="e-row"><span>시간</span><span class="e-auto">' + (hasPack ? '🎯 목표 3분 전까지 자동 계산' : '🎯 목표 시간에서 자동 계산') + '</span></div>'
        : '<label class="e-row"><span>시간</span><input class="e-min" type="number" min="1" max="120" step="1" value="' + t.minutes + '" aria-label="걸리는 시간(분)"><span class="unit">분</span></label>';
      return '' +
        '<article class="card' + (auto ? ' auto-card' : '') + '" data-id="' + esc(t.id) + '">' +
          '<div class="card-head">' +
            '<span class="step" style="--acc:' + bg + ';--accInk:' + ink + '">' + (i+1) + '</span>' +
