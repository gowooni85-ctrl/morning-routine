            '<span class="name">' + esc(t.name) + '</span>' +
            '<span class="mins' + (auto ? ' auto' : '') + '">' + (auto ? (hasPack ? '목표 3분 전까지' : '목표까지 자동') : t.minutes + '분') + '</span>' +
          '</div>' +
          '<div class="timer">' +
            '<span class="timer-time' + (auto ? ' wide' : '') + '">' + (auto ? fmtAutoClock(Left) : fmtClock(Left)) + '</span>' +
            '<span class="timer-bar" aria-hidden="true"><i></i></span>' +
          '</div>' +
          '<div class="btns">' +
            '<button class="btn btn-start" type="button" data-action="toggle-timer">▶ 시작</button>' +
            '<button class="btn btn-reset" type="button" data-action="reset-timer" aria-label="타이머를 처음으로 되돌리기" title="타이머 처음으로">↺</button>' +
            '<button class="btn btn-done" type="button" data-action="toggle-done"><span class="ck" aria-hidden="true">✓</span><span class="lbl">완료</span></button>' +
          '</div>' +
          '<span class="ribbon">지금 차례!</span>' +
          '<div class="edit">' +
            '<label class="e-row"><span>이름</span><input class="e-name" type="text" maxlength="24" value="' + esc(t.name) + '" aria-label="할 일 이름"></label>' +
            minField +
            '<label class="e-row"><span>이모지</span><input class="e-emoji" type="text" maxlength="8" value="' + esc(t.emoji) + '" aria-label="이모지"></label>' +
            '<div class="e-btns">' +
              '<button type="button" data-action="up" title="위로 옮기기" aria-label="위로 옮기기">▲</button>' +
              '<button type="button" data-action="down" title="아래로 옮기기" aria-label="아래로 옮기기">▼</button>' +
              '<button type="button" class="danger" data-action="del" title="지우기" aria-label="이 할 일 지우기">🗑 지우기</button>' +
            '</div>' +
          '</div>' +
        '</article>';
    }).join('');
    grid.innerHTML = html;
    cards = new Map();
    $$('.card', grid).forEach(function(el){ cards.set(el.dataset.id, el); });
    updateCards();
  }

  function updateCards(){
    var first = null;
    for(var i = 0; i < M().tasks.length; i++){
      if(!M().done[M().tasks[i].id]){ first = M().tasks[i]; break; }
    }
    M().tasks.forEach(function(t){
      var el = cards.get(t.id);
      if(!el) return;
      var auto = isAuto(t);
      var tm = M().timers[t.id];
      var isDone = !!M().done[t.id];
      var left = isDone ? 0 : taskLeftSeconds(t);
      var running = !!(tm && tm.endAt);
      var full = auto ? ((tm && tm.span > 0) ? tm.span : Math.max(1, left)) : t.minutes * 60;

      el.classList.toggle('done', isDone);
      el.classList.toggle('running', running && !isDone);
      el.classList.toggle('current', !isDone && !!first && first.id === t.id);
      el.classList.toggle('low', !isDone && running && left <= Math.max(15, full * 0.15));

      var timeEl = el.querySelector('.timer-time');
      setText(timeEl, isDone ? '완료!' : (auto ? fmtAutoClock(left) : fmtClock(left)));

      var minsEl = el.querySelector('.mins');
      if(minsEl && auto){
        var mm = Math.ceil(left / 60);
        setText(minsEl, isDone ? '완료' : (left > 0 ? '남은 시간 ' + mm + '분' : (hasFinalPack() ? '목표 3분 전까지' : '목표까지 자동')));
      }

      var bar = el.querySelector('.timer-bar i');
      if(bar){
        var frac = isDone ? 1 : (full > 0 ? Math.min(1, Math.max(0, (full - left) / full)) : 0);
        if(!isDone && auto && left <= 0) frac = 0;   /* 놀이할 시간이 없을 때는 빈 막대로 */
        var w = (frac * 100).toFixed(1) + '%';
        if(bar.style.width !== w) bar.style.width = w;
      }

      var startBtn = el.querySelector('.btn-start');
      if(startBtn){
        var noTime = auto && !isDone && !running && left <= 0;
        startBtn.disabled = isDone || noTime;
        var lab = isDone ? '✔ 끝' : (running ? '⏸ 잠깐' : (auto ? '▶ 시작' : (left < full - 0.5 ? '▶ 계속' : '▶ 시작')));
        setText(startBtn, noTime ? '시간 없음' : lab);
        startBtn.setAttribute('aria-label', t.name + ' 타이머 ' + (running ? '잠깐 멈추기' : '시작'));
      }
      var doneBtn = el.querySelector('.btn-done');
      if(doneBtn){
        setText(doneBtn.querySelector('.lbl'), isDone ? '됐어요!' : '완료');
        doneBtn.setAttribute('aria-pressed', isDone ? 'true' : 'false');
        doneBtn.setAttribute('aria-label', t.name + (isDone ? ' 완료 취소' : ' 완료로 표시'));
      }
      var resetBtn = el.querySelector('.btn-reset');
      if(resetBtn) resetBtn.disabled = isDone;
    });
  }

  function updateHero(){
    var total = M().tasks.length;
    var n = doneCount();
    var pct = total ? Math.round(n / total * 100) : 0;
    setText($('#progPct'), pct + '%');
    $('#progFill').style.width = pct + '%';
    var track = $('#progTrack');
    if(track) track.setAttribute('aria-valuenow', String(pct));
    setText($('#pCount'), n + ' / ' + total + ' 완료');

    var cur = null;
    for(var i = 0; i < M().tasks.length; i++){
      if(!M().done[M().tasks[i].id]){ cur = M().tasks[i]; break; }
    }
    var nowTask = $('#nowTask');
    if(!total) setText(nowTask, '할 일을 추가해 주세요');
    else if(!cur) setText(nowTask, '🎉 모든 미션 완료!');
    else if(isAuto(cur)) setText(nowTask, '🎲 이제 놀 시간! 목표까지 ' + Math.ceil(taskLeftSeconds(cur)/60) + '분 놀 수 있어요');
    else setText(nowTask, '👉 지금 차례: ' + cur.name + ' (' + cur.minutes + '분)');
  }

  function updateCountdown(){
    var now = new Date();
    var nowSec = now.getHours()*3600 + now.getMinutes()*60 + now.getSeconds();
    /* 오늘(또는 미리 보는 모드)에 적용되는 요일 묶음의 목표 시간 */
    var group = activeTargetGroup();
    var targetTxt = targetOf(group);
    var remain = clockToSecs(targetTxt) - nowSec;
    var isNextDay = false;
    var nextGroup = null;
    /* 목표 시간을 지난 저녁에는 내일(내일 요일 묶음) 목표까지 남은 시간으로 보여 준다. */
    if(remain < 0 && now.getHours() >= 12){
      nextGroup = targetGroupOfDate(new Date(now.getTime() + 86400000));
      targetTxt = targetOf(nextGroup);
      remain = 86400 + clockToSecs(targetTxt) - nowSec;
      isNextDay = true;
    }
    var taskLeft = remainingTaskSeconds();
    var buffer = remain - taskLeft;

    var total = M().tasks.length;
    var n = doneCount();
    var allDone = total > 0 && n === total;
    var play = autoTask();
    var playDone = !!(play && M().done[play.id]);
    var playSec = (play && !playDone) ? playAutoSeconds() : 0;
    var regTotal = regularTasks().length;
    var regAll = regTotal > 0 && regularDoneCount() === regTotal;
    var playMin = Math.floor(playSec / 60);

    var cls = 'calm', label = '', status = '';
    var cfg = MODES[state.mode === 'weekend' ? 'weekend' : 'weekday'];
    var isWeekend = cfg.key === 'weekend';
    var chipInfo = targetGroupInfo(nextGroup || group);
    var untilTxt = chipInfo.targetName + '(' + targetTxt + ')';

    if(allDone){
      cls = 'done';
      label = untilTxt + '까지 남은 시간';
      status = isWeekend ? '🎉 주말 미션 완료! 오늘은 가방 없이 신나게 놀자' : '🎉 미션 완료! 이제 가방만 들고 출발하면 돼요';
    } else if(isNextDay){
      cls = 'calm';
      label = '내일 ' + untilTxt + '까지 남은 시간';
      status = '🌙 오늘은 여기까지! 내일 아침에 다시 만나요';
    } else if(regAll && play){
      /* 보통 할 일은 다 끝나고 '🎲 놀기'만 남은 때 */
      cls = 'done';
      label = untilTxt + '까지 남은 시간';
      if(remain < 0) status = '🎲 할 일은 다 끝났어요! 이제 마음껏 놀아요';
      else if(playSec >= 60) status = '🎲 할 일 끝! 목표까지 ' + playMin + '분 놀 수 있어요';
      else status = '🎲 할 일 끝! 목표 시간이 코앞이에요';
    } else if(remain < 0){
      cls = 'behind';
      label = untilTxt + '을 지났어요';
      status = (isWeekend ? '😵 주말 미션 시간이 지났어요!' : '😵 출발 시간이 지났어요!') + ' 남은 할 일 ' + Math.ceil(taskLeft/60) + '분, 끝까지 힘내자!';
    } else if(buffer < 0){
      cls = 'behind';
      label = untilTxt + '까지 남은 시간';
      status = '😵 ' + Math.ceil(-buffer/60) + '분이 모자라요! 지금 바로 서두르자!';
    } else if(buffer < 10*60){
      cls = 'tight';
      label = untilTxt + '까지 남은 시간';
      status = '⏰ 아슬아슬! 여유가 ' + Math.max(0, Math.floor(buffer/60)) + '분뿐이에요';
    } else {
      cls = 'calm';
      label = untilTxt + '까지 남은 시간';
      status = play
        ? '😊 목표까지 ' + Math.max(0, Math.floor(buffer/60)) + '분 여유! 다 끝나면 ' + playMin + '분 놀 수 있어요'
        : '😊 여유 있어요! 목표보다 ' + Math.floor(buffer/60) + '분 넉넉해요';
    }

    var card = $('#cdCard');
    if(card){
      card.classList.remove('calm','tight','behind','done');
      card.classList.add(cls);
    }
    setText($('#cdLabel'), label);
    setText($('#cdUnit'), isNextDay ? '남음' : (remain < 0 ? '지남' : '남음'));

    var disp = (remain < 0) ? { text: '+' + fmtClock(-remain), long: false } : fmtCountdown(remain);
    var timeEl = $('#cdTime');
    if(timeEl){
      timeEl.classList.toggle('long', disp.long);
      var secNode = timeEl.querySelector('small');
      if(secNode){
        secNode.style.display = disp.long ? 'none' : '';
        if(timeEl.firstChild && timeEl.firstChild.nodeType === 3) timeEl.firstChild.nodeValue = disp.text;
        else timeEl.insertBefore(document.createTextNode(disp.text), secNode);
      } else {
        setText(timeEl, disp.text);
      }
    }
    setText($('#cdStatus'), status);

    var fill = remain > 0 ? Math.min(100, (taskLeft / Math.max(1, remain)) * 100) : 100;
    var fillEl = $('#cdFill');
    if(fillEl) fillEl.style.width = fill.toFixed(1) + '%';

    var finish = new Date(Date.now() + taskLeft * 1000);
    var finishStr = pad(finish.getHours()) + ':' + pad(finish.getMinutes());
    setText($('#targetText'), targetTxt);

    var sub = $('#cdSub');
    if(sub){
      var subHtml;
      if(allDone){
        subHtml = '<span>🎯 목표 ' + esc(targetTxt) + '</span><span>✅ ' + M().tasks.length + '개 미션 모두 완료</span><span>' + (isWeekend ? '🎈 이제 마음껏 놀자!' : '🚀 바로 출발!') + '</span>';
      } else if(isNextDay){
        subHtml = '<span>🎯 내일 목표 ' + esc(targetTxt) + '</span>' +
          '<span>⏳ 할 일 ' + Math.ceil(taskLeft/60) + '분</span>' +
          '<span>🌙 내일 아침에 시작해요</span>';
      } else {
        subHtml = '<span>🎯 목표 ' + esc(targetTxt) + '</span>' +
          '<span>⏳ 남은 할 일 ' + Math.ceil(taskLeft/60) + '분</span>' +
          '<span>🏁 예상 완료 ' + finishStr + '</span>' +
          (play && !playDone && playSec > 0 ? '<span>🎲 놀 시간 ' + Math.floor(playSec/60) + '분</span>' : '');
      }
      if(subHtml !== lastSubHtml){ sub.innerHTML = subHtml; lastSubHtml = subHtml; }
    }
  }

  /* ================= toast ================= */
  function toast(msg){
    var el = $('#toast');
    if(!el) return;
    el.textContent = msg;
    el.classList.add('show');
    if(toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ el.classList.remove('show'); }, 3200);
  }

  /* ================= task interactions ================= */
  function pulseCard(id){
    var el = cards.get(id);
    if(!el) return;
    var s = document.createElement('span');
    s.className = 'star-pop';
    s.textContent = '⭐';
    el.appendChild(s);
    setTimeout(function(){ if(s.parentNode) s.parentNode.removeChild(s); }, 950);
  }

  function pauseAll(){
    var now = Date.now();
    Object.keys(M().timers).forEach(function(id){
      var tm = M().timers[id];
      if(tm && tm.endAt){
        tm.left = Math.max(0, (tm.endAt - now) / 1000);
        tm.endAt = null;
      }
    });
    state.runningId = null;
  }

  function toggleTimer(id){
    var t = M().tasks.filter(function(x){ return x.id === id; })[0];
    if(!t || M().done[id]) return;
    var tm = M().timers[id];
    if(!tm) return;
    if(tm.endAt){
      tm.left = Math.max(0, (tm.endAt - Date.now()) / 1000);
      tm.endAt = null;
      if(state.runningId === id) state.runningId = null;
      save();
    } else {
      ensureAudio();
      if(!beginTimer(t)){
        toast('⏰ 목표 시간이 지나서 남은 놀 시간이 없어요');
        return;
      }
      save();
    }
    updateCards();
    updateCountdown();
  }

  /* 고른 할 일의 타이머를 지금부터 센다. 시간이 없으면 null. */
  function beginTimer(t){
    var tm = M().timers[t.id];
    if(!tm) return null;
    pauseAll();
    var span;
    if(isAuto(t)){
      span = playAutoSeconds();
      if(span <= 0) return null;
      tm.span = span;
    } else {
      if(!tm.left || tm.left <= 0) tm.left = t.minutes * 60;
      span = tm.left;
      tm.span = t.minutes * 60;
    }
    tm.left = span;
    tm.endAt = Date.now() + span * 1000;
    state.runningId = t.id;
    ensureAudio();
    return t;
  }

  /* 이 할 일 다음에 나오는, 아직 안 끝난 할 일.
     뒤에 남은 게 없으면 목록 맨 앞으로 돌아가서 찾는다(순서를 건너뛰고 체크한 경우). */
  function nextUncompletedAfter(id){
    var list = M().tasks;
    var i = -1;
    for(var k = 0; k < list.length; k++){ if(list[k].id === id){ i = k; break; } }
    for(var j = i + 1; j < list.length; j++){
      if(!M().done[list[j].id]) return list[j];
    }
    for(var m = 0; m < (i < 0 ? 0 : i); m++){
      if(!M().done[list[m].id]) return list[m];
    }
    return null;
  }

  /* 지금 차례인 할 일인가 (아직 안 끝난 것 중 맨 앞) */
  function isCurrentTask(id){
    var list = M().tasks;
    for(var i = 0; i < list.length; i++){
      if(!M().done[list[i].id]) return list[i].id === id;
    }
    return false;
  }

  /* 다음 할 일이 '🎲 놀기'인데 남는 시간이 없을 때 — 놀이는 건너뛰고 바로 그다음 할 일로 간다.
     (목표 시간이 박할 때도 '숙제가방 싸기'까지 거쳐서 하루가 끝까지 이어진다.) */
  var playSkippedNote = false;

  /* 하나가 끝나면 다음 할 일 타이머를 저절로 이어서 시작한다. */
  function autoAdvanceFrom(id){
    playSkippedNote = false;
    var next = nextUncompletedAfter(id);
    if(!next) return null;
    if(isAuto(next) && playAutoSeconds() <= 0){
      /* 놀이할 시간이 없으면 놀이는 바로 완료로 넘기고 다음 할 일을 시작한다. */
      M().done[next.id] = true;
      doneLock[next.id] = Date.now();
      playSkippedNote = true;
      next = nextUncompletedAfter(next.id);
      if(!next) return null;
    }
    return beginTimer(next) ? next : null;
  }

  function resetTimer(id){
    var t = M().tasks.filter(function(x){ return x.id === id; })[0];
    var tm = M().timers[id];
    if(!t || !tm) return;
    tm.endAt = null;
    tm.left = isAuto(t) ? 0 : t.minutes * 60;
    tm.span = tm.left;
    if(state.runningId === id) state.runningId = null;
    save();
    updateCards(); updateCountdown();
  }

  function toggleDone(id){
    var t = M().tasks.filter(function(x){ return x.id === id; })[0];
    if(!t) return;
    var tm = M().timers[id];

    if(M().done[id]){
      if(doneLock[id] && Date.now() - doneLock[id] < 1200) return;
      delete M().done[id];
      if(tm){ tm.endAt = null; tm.left = isAuto(t) ? 0 : t.minutes * 60; tm.span = tm.left; }
      if(state.runningId === id) state.runningId = null;
      chime('undo');
      save();
      updateCards(); updateHero(); updateCountdown();
      return;
    }

    /* 어느 할 일을 완료했든 다음 할 일 타이머를 저절로 이어서 시작한다.
       · 방금 끝낸 할 일의 타이머가 돌고 있었으면 그대로 이어서,
       · 타이머 없이 손으로 ✓ 한 경우, 차례가 아닌 할 일을 먼저 ✓ 한 경우,
         직접 넣은 할 일(예: 국어 쓰기노트)을 ✓ 한 경우에도 다음 할 일을 찾아 시작한다.
       · 다만 다른 할 일의 타이머가 지금 돌고 있으면 그건 그대로 둔다(그 할 일이 지금 차례). */
    var runningBefore = state.runningId;
    M().done[id] = true;
    doneLock[id] = Date.now();
    if(tm && tm.endAt){
      tm.left = Math.max(0, (tm.endAt - Date.now()) / 1000);
      tm.endAt = null;
    }
    if(state.runningId === id) state.runningId = null;
    chime('pop');
    pulseCard(id);
    ensureAudio();
    var busyOther = !!(runningBefore && runningBefore !== id && !M().done[runningBefore] &&
                       M().timers[runningBefore] && M().timers[runningBefore].endAt);
    var next = busyOther ? null : autoAdvanceFrom(id);
    save();
    updateCards(); updateHero(); updateCountdown();
    if(next){
      toast('👍 ' + t.name + ' 끝! ' + (playSkippedNote ? '남는 시간이 없어 🎲 놀기는 건너뛰고 ' : '이어서 ') +
        next.name + ' ' + Math.ceil(taskLeftSeconds(next)/60) + '분 시작!');
    }
    checkAllDone();
  }

  function moveTask(id, dir){
    var i = M().tasks.findIndex(function(t){ return t.id === id; });
    var j = i + dir;
    if(i < 0 || j < 0 || j >= M().tasks.length) return;
    var tmp = M().tasks[i];
    M().tasks[i] = M().tasks[j];
    M().tasks[j] = tmp;
    save();
    renderGrid();
    updateHero();
    updateCountdown();
  }

  function deleteTask(btn, id){
    if(btn.dataset.armed === '1'){
      M().tasks = M().tasks.filter(function(t){ return t.id !== id; });
      delete M().timers[id];
      delete M().done[id];
      if(state.runningId === id) state.runningId = null;
      save();
      renderGrid(); updateHero(); updateCountdown();
      toast('할 일을 지웠어요');
      return;
    }
    var old = btn.textContent;
    btn.dataset.armed = '1';
    btn.textContent = '정말 지울까요?';
    btn.classList.add('armed');
    setTimeout(function(){
      if(!btn.isConnected) return;
      btn.dataset.armed = '';
      btn.textContent = old;
      btn.classList.remove('armed');
    }, 2600);
  }

  function addTask(){
    var t = { id: newId(), emoji: '⭐', name: '새 할 일', minutes: 5 };
    M().tasks.push(t);
    M().timers[t.id] = { left: t.minutes*60, endAt: null, span: t.minutes*60 };
    save();
    renderGrid(); updateHero(); updateCountdown();
    var el = cards.get(t.id);
    if(el){
      try { el.scrollIntoView({ behavior:'smooth', block:'center' }); } catch(e){}
      var inp = el.querySelector('.e-name');
      if(inp){ inp.focus(); inp.select(); }
    }
  }

  function resetToday(){
    if(!window.confirm((state.mode === 'weekend' ? '주말 모드' : '평일 모드') + '에서 오늘 체크한 내용과 타이머를 모두 지울까요?')) return;
    M().done = {};
    state.runningId = null;
    state.stats.celebrated = null;
    doneLock = {};
    M().tasks.forEach(function(t){ M().timers[t.id] = freshTimer(t); });
    save();
    renderGrid(); updateHero(); updateCountdown();
    toast('오늘 체크를 처음으로 되돌렸어요');
  }

  /* 지금 모드의 목록·목표 시간만 기본값으로 되돌린다(다른 모드는 그대로). */
  function restoreDefaults(){
    var isWeekend = state.mode === 'weekend';
    if(!window.confirm((isWeekend ? '주말 모드' : '평일 모드') + '의 할 일 목록과 목표 시간을 처음 상태로 되돌릴까요?')) return;
    var fresh = isWeekend
      ? freshMode(DEFAULT_WEEKEND_TASKS, 'w')
      : freshMode(DEFAULT_WEEKDAY_TASKS, 'd');
    M().tasks = fresh.tasks;
    M().timers = fresh.timers;
    M().done = {};
    var g = activeTargetGroup();
    state.targets[g] = DEFAULT_TARGETS[g];
    state.runningId = null;
    state.stats.celebrated = null;
    doneLock = {};
    save();
    renderGrid(); renderMode(); updateHero(); updateCountdown();
    toast('기본 목록으로 되돌렸어요 · ' + targetGroupInfo(g).label + ' 목표 ' + DEFAULT_TARGETS[g]);
  }

  /* ================= parent mode ================= */
  function setParent(on){
    parentMode = !!on;
    document.body.classList.toggle('parent-mode', parentMode);
    var panel = $('#parentPanel');
    if(panel) panel.hidden = !parentMode;
    var btn = $('#parentBtn');
    if(btn){
      btn.classList.toggle('active', parentMode);
      btn.setAttribute('aria-pressed', parentMode ? 'true' : 'false');
      setText(btn, parentMode ? '👩 설정 끝내기' : '👩 엄마 설정');
    }
    if(parentMode && panel){
      try { panel.scrollIntoView({ behavior:'smooth', block:'nearest' }); } catch(e){}
    }
    renderMode();
  }

  /* ================= mode (평일 / 주말) ================= */
  function renderMode(){
    var isWeekend = state.mode === 'weekend';
    var cfg = MODES[isWeekend ? 'weekend' : 'weekday'];
    var blk = M();
    document.body.classList.toggle('weekend-mode', isWeekend);

    var pill = $('#modePill');
    if(pill){
      pill.classList.toggle('weekend', isWeekend);
      pill.setAttribute('aria-pressed', isWeekend ? 'true' : 'false');
      var face = pill.querySelector('.mp-face');
      if(face) setText(face, cfg.emoji);
      var txt = pill.querySelector('.mp-text');
      if(txt) setText(txt, cfg.label);
      var cnt = pill.querySelector('.mp-count');
      if(cnt) setText(cnt, blk.tasks.length + '단계');
      pill.setAttribute('aria-label', '지금은 ' + cfg.label + ' 모드, ' + blk.tasks.length + '단계. 눌러서 ' + (isWeekend ? '평일' : '주말') + ' 모드로 바꾸기');
      pill.title = '눌러서 ' + (isWeekend ? '평일' : '주말') + ' 모드로 바꾸기 (오늘 하루만 바뀌어요)';
    }
    var title = document.querySelector('.p-title');
    if(title) setText(title, cfg.emoji + ' 오늘의 ' + cfg.label + ' 미션 진행률');

    var tl = $('#targetFieldLabel');
    if(tl){
      setText(tl, '요일별 목표 시간 · 지금 적용 ' + targetGroupInfo(activeTargetGroup()).label + ' ' + activeTarget());
    }
    var note = $('#ppModeNote');
    if(note){
      var hasPlay = blk.tasks.some(function(t){ return isAuto(t); });
      note.innerHTML = '지금은 ' + cfg.emoji + ' <b>' + esc(cfg.label) + ' 모드</b>의 목록을 고치고 있어요 · ' +
        blk.tasks.length + '단계 · 목표 ' + esc(activeTarget()) +
        (state.modePref ? ' · 오늘은 손으로 바꾼 모드' : ' · 요일에 맞춰 자동') +
        '<br>🎯 목표 시간 · ' + TARGET_GROUPS.map(function(g){ return esc(g.label) + ' ' + esc(targetOf(g.key)); }).join(' · ') +
        (hasPlay ? '<br>🎲 놀기 = ' + (hasFinalPack() ? '목표 3분 전까지 남는 시간' : '목표 시간에서 남는 시간') + '이 저절로 계산돼요(시간 입력 없음)' : '');
    }
    renderTargets();
  }

  /* 엄마 설정의 네 칸(월~목 / 금 / 토 / 일)을 저장값과 맞추고, 오늘 적용되는 칸을 표시한다. */
  function renderTargets(){
    var active = activeTargetGroup();
    $$('input[data-target-group]').forEach(function(inp){
      var k = inp.getAttribute('data-target-group');
      if(TARGET_KEYS.indexOf(k) < 0) return;
      var v = targetOf(k);
      if(inp.value !== v) inp.value = v;
      var card = inp.closest ? inp.closest('.tg') : null;
      if(card){
        card.classList.toggle('today', k === active);
        var badge = card.querySelector('.tg-badge');
        if(badge) badge.hidden = (k !== active);
      }
      inp.setAttribute('aria-label', targetGroupInfo(k).days + ' 목표 시간 ' + v + (k === active ? ' (오늘)' : ''));
    });
    var chip = $('#targetChip');
    if(chip){
      var ck = chipGroupNow();
      chip.title = targetGroupInfo(ck).label + ' 목표 시간 바꾸기 (' + targetOf(ck) + ')';
    }
  }

  /* 손으로 모드 바꾸기: 그날 하루만 기억한다. */
  function setMode(mode, manual){
    if(mode !== 'weekday' && mode !== 'weekend') return;
    if(state.mode === mode){ renderMode(); return; }
    pauseAll();
    state.mode = mode;
    if(manual) state.modePref = { date: dateKey(new Date()), mode: mode };
    lastSubHtml = '';
    save();
    renderMode(); renderGrid(); updateHero(); updateCountdown();
    if(manual){
      toast(mode === 'weekend'
        ? '🌈 주말 모드! 가방 싸기 빼고 ' + M().tasks.length + '단계예요'
        : '🎒 평일 모드! ' + M().tasks.length + '단계로 등원 준비해요');
    }
  }

  /* ================= celebration ================= */
  function checkAllDone(){
    var total = M().tasks.length;
    if(!total) return;
    if(doneCount() < total) return;
    var today = dateKey(new Date());
    if(state.stats.lastAllDone !== today){
      state.stats.streak = (state.stats.lastAllDone === yesterdayKey()) ? (state.stats.streak + 1) : 1;
      state.stats.lastAllDone = today;
      save();
    }
    if(state.stats.celebrated !== today){
      state.stats.celebrated = today;
      save();
      celebrate();
    }
    updateHero();
  }

  function celebrate(){
    var now = new Date();
    var tp = targetParts();
    var target = new Date(now.getTime());
    target.setHours(tp.h, tp.m, 0, 0);
    var diff = Math.round((target - now) / 60000);
    var tn = MODES[state.mode === 'weekend' ? 'weekend' : 'weekday'].targetName;
    var msg;
    if(diff > 0) msg = tn + ' ' + activeTarget() + '보다 ' + diff + '분 일찍 끝냈어요!';
    else if(diff === 0) msg = '딱 ' + tn + ' 시간에 맞춰 끝냈어요!';
    else msg = '조금 늦었지만 ' + M().tasks.length + '개 미션을 모두 해냈어요!';

    setText($('#celebrateMsg'), msg);
    var stars = $('#celebrateStars');
    if(stars){
      var n = Math.min(20, M().tasks.length);
      stars.textContent = new Array(n + 1).join('⭐');
    }
    var ov = $('#celebrate');
    if(ov) ov.hidden = false;
    chime('fanfare');
    if(!reduceMotion) confettiBurst();
  }

  function closeCelebrate(){
    var ov = $('#celebrate');
    if(ov) ov.hidden = true;
  }

  function confettiBurst(){
    var cv = $('#confetti');
    if(!cv || !cv.getContext) return;
    var ctx = cv.getContext('2d');
    if(!ctx) return;
    var dpr = Math.min(2, window.devicePixelRatio || 1);
    var W = window.innerWidth, H = window.innerHeight;
    cv.width = Math.floor(W * dpr);
    cv.height = Math.floor(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cv.style.display = 'block';

    var colors = ['#ff8a8a','#ffc75f','#7ee0b8','#7fb6ff','#c9a7ff','#ff9ecd','#ffe27a','#79d7e6'];
    var parts = [];
    var N = Math.min(220, Math.max(90, Math.round(W / 6)));
    for(var i = 0; i < N; i++){
      parts.push({
        x: Math.random() * W,
        y: -30 - Math.random() * H * 0.6,
        w: 6 + Math.random() * 9,
        h: 8 + Math.random() * 11,
        vx: -50 + Math.random() * 100,
        vy: 70 + Math.random() * 160,
        rot: Math.random() * Math.PI * 2,
        vr: -7 + Math.random() * 14,
        c: colors[Math.floor(Math.random() * colors.length)],
        round: Math.random() < 0.3
      });
    }
    var t0 = performance.now();
    var DUR = 4600;
    function frame(t){
      var elapsed = t - t0;
      ctx.clearRect(0, 0, W, H);
      var alpha = Math.max(0, 1 - elapsed / DUR);
      for(var k = 0; k < parts.length; k++){
        var p = parts[k];
        p.x += p.vx * 0.016;
        p.y += p.vy * 0.016;
        p.vy += 0.65;
        p.rot += p.vr * 0.016;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.globalAlpha = alpha;
        ctx.fillStyle = p.c;
        if(p.round){
          ctx.beginPath();
          ctx.arc(0, 0, p.w / 2, 0, Math.PI * 2);
          ctx.fill();
        } else {
          ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        }
        ctx.restore();
      }
      if(elapsed < DUR){
        requestAnimationFrame(frame);
      } else {
        ctx.clearRect(0, 0, W, H);
        cv.style.display = 'none';
      }
    }
    requestAnimationFrame(frame);
  }

  /* ================= loop ================= */
  function tickTimers(now){
    var ended = [];
    M().tasks.forEach(function(t){
      var tm = M().timers[t.id];
      if(!tm || !tm.endAt) return;
      if(tm.endAt - now <= 0){
        tm.left = 0;
        tm.endAt = null;
        state.runningId = null;
        ended.push(t);
      }
    });
    if(!ended.length) return;
    ended.forEach(function(t){
      /* 1) 종료 알림음 2) 그 할 일을 완료로 3) 다음 할 일 타이머를 이어서 자동 시작 */
      chime('alarm');
      if(!M().done[t.id]){
        M().done[t.id] = true;
        doneLock[t.id] = Date.now();
        pulseCard(t.id);
      }
      ensureAudio();
      var next = autoAdvanceFrom(t.id);
      save();
      updateCards(); updateHero(); updateCountdown();
      var el = cards.get(t.id);
      if(el){
        el.classList.add('flash');
        setTimeout(function(){ el.classList.remove('flash'); }, 2600);
      }
      if(next){
        toast('⏰ ' + t.name + ' 끝! ' + (playSkippedNote ? '남는 시간이 없어 🎲 놀기는 건너뛰고 ' : '다음은 ') +
          next.name + ' ' + Math.ceil(taskLeftSeconds(next)/60) + '분 시작!');
      } else {
        toast('⏰ ' + t.name + ' 끝!');
      }
      if(navigator.vibrate){ try { navigator.vibrate([90, 70, 90]); } catch(e){} }
    });
    checkAllDone();
  }

  function loop(){
    var now = Date.now();
    if(rolloverIfNeeded()){
      lastSubHtml = '';
      renderMode();
      renderGrid();
      updateHero();
    }
    renderClock(new Date(now));
    tickTimers(now);
    updateCards();
    updateCountdown();
    if(state.runningId && now - lastSave > 5000) save();
  }

  /* ================= events ================= */
  function wire(){
    var grid = $('#grid');

    grid.addEventListener('click', function(e){
      var btn = e.target.closest ? e.target.closest('button[data-action]') : null;
      var cardEl = e.target.closest ? e.target.closest('.card') : null;
      if(!cardEl) return;
      var id = cardEl.dataset.id;
      if(!btn) return;
      var action = btn.dataset.action;
      if(action === 'toggle-timer'){ toggleTimer(id); }
      else if(action === 'reset-timer'){ resetTimer(id); }
      else if(action === 'toggle-done'){ toggleDone(id); }
      else if(action === 'up'){ moveTask(id, -1); }
      else if(action === 'down'){ moveTask(id, 1); }
      else if(action === 'del'){ deleteTask(btn, id); }
    });

    grid.addEventListener('change', function(e){
      var cardEl = e.target.closest ? e.target.closest('.card') : null;
      if(!cardEl) return;
      var id = cardEl.dataset.id;
      var t = M().tasks.filter(function(x){ return x.id === id; })[0];
      if(!t) return;
      var el = e.target;

      if(el.classList.contains('e-name')){
        var v = el.value.trim();
        if(v) t.name = v.slice(0, 24);
        el.value = t.name;
        save();
        renderGrid(); updateHero(); updateCountdown();
      } else if(el.classList.contains('e-min')){
        t.minutes = clampInt(el.value, 1, 120, t.minutes);
        el.value = t.minutes;
        var tm = M().timers[id];
        if(tm && !tm.endAt) tm.left = t.minutes * 60;
        save();
        renderGrid(); updateHero(); updateCountdown();
      } else if(el.classList.contains('e-emoji')){
        var em = el.value.trim().slice(0, 8) || '⭐';
        t.emoji = em;
        el.value = em;
        save();
        renderGrid(); updateHero(); updateCountdown();
      }
    });

    $('#parentBtn').addEventListener('click', function(){ setParent(!parentMode); });

    var pill = $('#modePill');
    if(pill) pill.addEventListener('click', function(){
      setMode(state.mode === 'weekend' ? 'weekday' : 'weekend', true);
    });

    var autoBtn = $('#autoModeBtn');
    if(autoBtn) autoBtn.addEventListener('click', function(){
      state.modePref = null;
      setMode(autoMode(new Date()), false);
      save();
      renderMode();
      toast('요일에 맞는 모드로 돌아왔어요');
    });

    $('#soundBtn').addEventListener('click', function(){
      state.settings.sound = !state.settings.sound;
      if(state.settings.sound){ unlockAudio(); chime('pop'); }
      this.textContent = state.settings.sound ? '🔊' : '🔇';
      this.setAttribute('aria-label', state.settings.sound ? '소리 끄기' : '소리 켜기');
      save();
      toast(state.settings.sound ? '소리를 켰어요' : '소리를 껐어요');
    });

    /* 타이머가 끝날 때 나는 소리를 미리 들어보기 (엄마 설정 안) */
    var testBtn = $('#testSound');
    if(testBtn) testBtn.addEventListener('click', function(){
      state.settings.sound = true;
      var sb = $('#soundBtn');
      if(sb){ sb.textContent = '🔊'; sb.setAttribute('aria-label', '소리 끄기'); }
      unlockAudio();
      chime('alarm');
      save();
      toast('🔔 이렇게 소리가 나요! (타이머가 끝나면 이 소리가 울려요)');
    });

    /* 목표 칩: 오늘(저녁이면 내일) 적용되는 요일 묶음의 목표 시간 칸으로 바로 간다. */
    $('#targetChip').addEventListener('click', function(){
      setParent(true);
      var g = chipGroupNow();
      var inp = document.querySelector('input[data-target-group="' + g + '"]');
      if(inp){
        var card = inp.closest ? inp.closest('.tg') : null;
        if(card){
          card.classList.remove('ring');
          void card.offsetWidth;
          card.classList.add('ring');
          setTimeout(function(){ card.classList.remove('ring'); }, 3200);
        }
        inp.focus();
        try { inp.showPicker && inp.showPicker(); } catch(e){}
      }
    });

    /* 요일 묶음별 목표 시간 고치기 (월~목 / 금 / 토 / 일) */
    $$('input[data-target-group]').forEach(function(inp){
      inp.addEventListener('change', function(){
        var k = this.getAttribute('data-target-group');
        if(TARGET_KEYS.indexOf(k) < 0) return;
        var v = this.value;
        if(!timeOk(v)){
          this.value = targetOf(k);
          toast('시간을 다시 확인해 주세요');
          return;
        }
        state.targets[k] = v;
        save();
        renderTargets();
        renderMode();
        updateCountdown();
        var info = targetGroupInfo(k);
        toast('목표 시간을 바꿨어요 · ' + info.emoji + ' ' + info.days + ' ' + v +
          (k === activeTargetGroup() ? '' : ' (오늘 화면에는 ' + activeTarget() + ' 적용)'));
      });
    });

    $('#addTask').addEventListener('click', addTask);
    $('#resetToday').addEventListener('click', resetToday);
    $('#restoreDefaults').addEventListener('click', restoreDefaults);
    $('#celebrateClose').addEventListener('click', closeCelebrate);

    document.addEventListener('keydown', function(e){
      if(e.key === 'Escape'){
        if(!$('#celebrate').hidden) closeCelebrate();
        else if(parentMode) setParent(false);
      }
    });

    /* 아이폰·아이패드 사파리: 사용자가 화면을 누를 때마다 <audio>와 Web Audio를
       '이 페이지에서 열린' 상태로 만들어 둔다(타이머가 끝날 때 소리가 나도록). */
    ['pointerdown', 'touchstart', 'mousedown', 'click', 'keydown'].forEach(function(ev){
      document.addEventListener(ev, function(){ unlockAudio(); }, { passive: true });
    });

    document.addEventListener('visibilitychange', function(){
      if(!document.hidden){
        unlockAudio();
        if(rolloverIfNeeded()){ lastSubHtml = ''; renderMode(); renderGrid(); updateHero(); }
        updateCards(); updateHero(); updateCountdown();
      } else {
        save();
      }
    });

    window.addEventListener('beforeunload', save);
    window.addEventListener('pagehide', save);
  }

  /* ================= init ================= */
  function init(){
    state = loadState();
    rolloverIfNeeded();
    buildAudioEls();   /* 소리 요소를 미리 만들어 두고, 첫 터치에 열어 둔다 */

    var today = dateKey(new Date());
    if(state.stats.lastAllDone && state.stats.lastAllDone !== today && state.stats.lastAllDone !== yesterdayKey()){
      state.stats.streak = 0;
    }

    var sb = $('#soundBtn');
    if(sb){
      sb.textContent = state.settings.sound ? '🔊' : '🔇';
      sb.setAttribute('aria-label', state.settings.sound ? '소리 끄기' : '소리 켜기');
    }
    renderGrid();
    renderMode();
    renderClock(new Date());
    updateHero();
    updateCountdown();
    setParent(false);
    wire();
    setInterval(loop, 250);
    loop();
    save();
  }

  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
