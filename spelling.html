<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#e8f4ff">
<title>🚌 탈것 스펠링 모험</title>
<style>
  :root{
    --blue:#2563eb; --blue-l:#dbeafe; --sky:#e8f4ff;
    --green:#16a34a; --green-l:#dcfce7;
    --orange:#f97316; --amber:#ffb020;
    --pink:#ff6b9d; --purple:#8b5cf6;
    --ink:#1f2a44; --muted:#64748b;
    --card:#ffffff;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
    color:var(--ink);
    background:linear-gradient(180deg,#e6f3ff 0%,#f3f9ff 38%,#fff8ea 100%);
    background-attachment:fixed;
    min-height:100dvh;
    -webkit-user-select:none;user-select:none;
    touch-action:manipulation;
    overscroll-behavior:none;
    -webkit-text-size-adjust:100%;
  }
  .app{
    max-width:760px;margin:0 auto;
    padding:calc(env(safe-area-inset-top) + 12px) 15px calc(env(safe-area-inset-bottom) + 26px);
  }

  /* ---------- header ---------- */
  .top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px}
  .brand{display:flex;align-items:center;gap:10px;min-width:0}
  .brand .logo{
    font-size:30px;line-height:1;filter:drop-shadow(0 3px 4px rgba(37,99,235,.2));
    animation:bob 2.6s ease-in-out infinite;
  }
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-4px) rotate(3deg)}}
  .brand h1{font-size:19px;margin:0;letter-spacing:-.4px;line-height:1.15}
  .brand p{margin:2px 0 0;font-size:11.5px;color:var(--muted);font-weight:600}
  .score{
    display:flex;align-items:center;gap:4px;background:#fff;border-radius:999px;
    padding:8px 13px;font-size:14px;font-weight:800;color:#b45309;
    box-shadow:0 3px 0 #f0dcc0,0 6px 14px rgba(180,83,9,.10);white-space:nowrap;
  }
  .score b{font-size:16px}

  /* ---------- screens ---------- */
  .screen{display:none;animation:fade .28s ease}
  .screen.on{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  /* ---------- home ---------- */
  .filters{display:flex;gap:8px;margin-bottom:14px;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch}
  .filters::-webkit-scrollbar{display:none}
  .chip{
    flex:0 0 auto;border:none;font-family:inherit;font-weight:800;font-size:13px;
    padding:10px 15px;border-radius:999px;background:#fff;color:var(--muted);
    box-shadow:0 2px 8px rgba(37,99,235,.08);transition:.18s;cursor:pointer;
  }
  .chip.on{background:var(--blue);color:#fff;box-shadow:0 4px 12px rgba(37,99,235,.34)}
  .modes{display:flex;flex-direction:column;gap:13px}
  .mode-card{
    position:relative;display:flex;align-items:center;gap:14px;width:100%;text-align:left;
    border:none;font-family:inherit;cursor:pointer;color:var(--ink);
    padding:17px 16px;border-radius:22px;background:#fff;
    box-shadow:0 5px 0 #dfe9f7,0 12px 26px rgba(37,99,235,.10);
    transition:transform .12s,box-shadow .12s;
  }
  .mode-card:active{transform:translateY(4px);box-shadow:0 1px 0 #dfe9f7,0 4px 12px rgba(37,99,235,.10)}
  .mode-emoji{
    flex:0 0 auto;width:56px;height:56px;border-radius:18px;display:grid;place-items:center;
    font-size:30px;background:var(--blue-l);
  }
  .mode-card[data-mode="fill"] .mode-emoji{background:#fef3c7}
  .mode-card[data-mode="type"] .mode-emoji{background:#fce7f3}
  .mode-txt{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1}
  .mode-txt b{font-size:17.5px;letter-spacing:-.3px}
  .mode-txt i{font-style:normal;font-size:12.5px;color:var(--muted);font-weight:600;line-height:1.35}
  .mode-level{
    flex:0 0 auto;font-size:11px;font-weight:800;padding:5px 9px;border-radius:999px;
    background:#eff6ff;color:#2563eb;
  }
  .mode-card[data-mode="fill"] .mode-level{background:#fffbeb;color:#b45309}
  .mode-card[data-mode="type"] .mode-level{background:#fdf2f8;color:#be185d}
  .book-btn{
    margin-top:16px;width:100%;display:flex;align-items:center;justify-content:center;gap:8px;
    border:none;font-family:inherit;font-size:15px;font-weight:800;color:#6d28d9;cursor:pointer;
    padding:15px;border-radius:18px;background:#f5f3ff;box-shadow:0 3px 0 #ddd6fe;
  }
  .book-btn:active{transform:translateY(3px);box-shadow:none}
  .book-btn b{font-size:13px;color:#8b5cf6;background:#fff;padding:3px 8px;border-radius:999px}
  .foot{text-align:center;font-size:11.5px;color:#94a3b8;font-weight:700;margin:18px 0 0}

  /* ---------- play ---------- */
  .play-top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .icon-btn{
    flex:0 0 auto;width:42px;height:42px;border-radius:14px;border:none;background:#fff;
    font-size:20px;color:var(--muted);box-shadow:0 3px 0 #e2e8f0;cursor:pointer;font-family:inherit;font-weight:800;
  }
  .icon-btn:active{transform:translateY(3px);box-shadow:none}
  .progress{flex:1;display:flex;align-items:center;gap:9px;min-width:0}
  .bar{flex:1;height:12px;border-radius:999px;background:#e2ecf9;overflow:hidden}
  .bar i{display:block;height:100%;width:0;border-radius:999px;
    background:linear-gradient(90deg,#60a5fa,#2563eb);transition:width .35s cubic-bezier(.34,1.56,.64,1)}
  .progress span{font-size:12px;font-weight:800;color:var(--muted);white-space:nowrap}
  .combo{
    flex:0 0 auto;font-size:13px;font-weight:900;color:#ea580c;background:#fff7ed;
    padding:6px 10px;border-radius:999px;opacity:0;transform:scale(.7);transition:.25s;white-space:nowrap;
  }
  .combo.on{opacity:1;transform:scale(1);animation:pulse 1s ease-in-out infinite}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.09)}}

  .card{
    background:var(--card);border-radius:24px;
    box-shadow:0 5px 0 #e6eefa,0 14px 30px rgba(37,99,235,.09);
  }
  .wordcard{padding:16px 16px 14px;text-align:center;margin-bottom:13px;position:relative;overflow:hidden}
  .emoji{font-size:clamp(56px,17vw,84px);line-height:1.05;filter:drop-shadow(0 6px 10px rgba(0,0,0,.12));animation:pop .4s cubic-bezier(.34,1.56,.64,1)}
  @keyframes pop{0%{transform:scale(.6);opacity:.2}60%{transform:scale(1.12)}100%{transform:scale(1)}}
  .ko{font-size:clamp(19px,5.4vw,24px);font-weight:900;letter-spacing:-.5px;margin-top:2px}
  .speak{
    display:inline-flex;align-items:center;gap:7px;margin-top:11px;border:none;font-family:inherit;
    font-size:15px;font-weight:800;color:#fff;cursor:pointer;padding:12px 22px;border-radius:999px;
    background:linear-gradient(180deg,#60a5fa,#2563eb);box-shadow:0 4px 0 #1d4ed8,0 8px 18px rgba(37,99,235,.3);
  }
  .speak:active{transform:translateY(4px);box-shadow:0 1px 0 #1d4ed8}
  .tipbar{
    margin-top:12px;background:#fffbeb;border:2px dashed #fcd34d;border-radius:14px;
    padding:10px 13px;font-size:13.5px;font-weight:700;color:#92400e;text-align:left;line-height:1.4;
    animation:fade .26s ease;
  }
  .playarea{padding:18px 14px 20px}

  /* slots & tiles */
  .slots{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin-bottom:20px}
  .slot{
    width:clamp(36px,10.5vw,56px);height:clamp(46px,13.5vw,68px);border-radius:14px;
    border:3px dashed #c3d7f2;background:#f7fbff;display:flex;align-items:center;justify-content:center;
    font-size:clamp(23px,7.6vw,36px);font-weight:800;color:var(--blue);
    font-family:"Avenir Next","Trebuchet MS",Verdana,sans-serif;transition:.15s;
  }
  .slot.gap{width:12px;border:none;background:transparent}
  .slot.next{border-color:var(--amber);background:#fffaea;box-shadow:0 0 0 4px rgba(255,176,32,.18)}
  .slot.filled{border-style:solid;border-color:#86efac;background:#f0fdf4;color:#15803d;animation:pop .22s}
  .slot.bad{animation:shake .4s}
  .slots.shake{animation:shake .4s}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
  .tiles{display:flex;flex-wrap:wrap;gap:9px;justify-content:center}
  .tile{
    min-width:clamp(44px,12.5vw,60px);height:clamp(50px,14.5vw,70px);padding:0 10px;
    border-radius:16px;border:none;font-family:"Avenir Next","Trebuchet MS",Verdana,sans-serif;
    font-size:clamp(25px,8vw,38px);font-weight:800;color:#1d4ed8;cursor:pointer;
    background:linear-gradient(180deg,#ffffff,#e9f2ff);
    box-shadow:0 4px 0 #b9cdea,0 8px 16px rgba(37,99,235,.13);
    transition:transform .1s,box-shadow .1s,opacity .2s;
  }
  .tile:active{transform:translateY(3px);box-shadow:0 1px 0 #b9cdea}
  .tile.used{opacity:0;transform:scale(.5);pointer-events:none}
  .tile.hintme{animation:hintglow 1s ease-in-out infinite}
  @keyframes hintglow{0%,100%{box-shadow:0 4px 0 #b9cdea,0 0 0 0 rgba(255,176,32,0)}50%{box-shadow:0 4px 0 #b9cdea,0 0 0 8px rgba(255,176,32,.35)}}
  .tile.shake{animation:shake .4s}

  /* fill mode */
  .fillrow{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;margin-bottom:22px}
  .fl{
    min-width:clamp(30px,8.4vw,46px);height:clamp(44px,12.5vw,62px);border-radius:12px;
    display:flex;align-items:center;justify-content:center;font-weight:800;
    font-family:"Avenir Next","Trebuchet MS",Verdana,sans-serif;font-size:clamp(23px,7.4vw,34px);
    color:#1e293b;background:#f1f5f9;
  }
  .fl.space{background:transparent;min-width:10px;width:10px}
  .fl.blank{border:3px dashed #f5b942;background:#fffbeb;color:#d97706}
  .fl.blank.next{border-style:solid;box-shadow:0 0 0 4px rgba(255,176,32,.22);animation:pulse 1.2s infinite}
  .fl.blank.filled{border-style:solid;border-color:#86efac;background:#f0fdf4;color:#15803d;animation:pop .22s}
  .bubbles{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
  .bubble{
    width:clamp(54px,15vw,68px);height:clamp(54px,15vw,68px);border-radius:50%;border:none;
    font-family:"Avenir Next","Trebuchet MS",Verdana,sans-serif;font-size:clamp(24px,7.6vw,32px);
    font-weight:800;color:#fff;cursor:pointer;
    background:radial-gradient(circle at 32% 28%,#a5b4fc,#6366f1 70%);
    box-shadow:0 5px 0 #4338ca,0 10px 18px rgba(67,56,202,.25),inset 0 -6px 12px rgba(0,0,0,.10);
    transition:transform .1s,box-shadow .1s;
  }
  .bubble:active{transform:translateY(4px);box-shadow:0 1px 0 #4338ca}
  .bubble.shake{animation:shake .4s}
  .bubble.hintme{animation:hintglow 1s infinite}

  /* typing mode */
  .typeboxes{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:16px}
  .tb{
    width:clamp(28px,8.2vw,44px);height:clamp(42px,12vw,60px);border-radius:11px;
    border:3px solid #dbe6f5;background:#f8fbff;display:flex;align-items:center;justify-content:center;
    font-family:"Avenir Next","Trebuchet MS",Verdana,sans-serif;font-size:clamp(20px,6.6vw,30px);
    font-weight:800;color:#1d4ed8;transition:.15s;
  }
  .tb.space{border:none;background:transparent;width:10px}
  .tb.now{border-color:var(--blue);box-shadow:0 0 0 4px rgba(37,99,235,.16);animation:pulse 1.1s infinite}
  .tb.bad{border-color:#fca5a5;background:#fef2f2;color:#dc2626;animation:shake .4s}
  .kb{display:flex;flex-direction:column;gap:7px;margin-top:6px}
  .kbrow{display:flex;gap:5px;justify-content:center}
  .key{
    flex:1 1 0;min-width:0;height:clamp(42px,11.5vw,56px);border-radius:11px;border:none;
    background:#fff;box-shadow:0 3px 0 #cbd5e1;font-family:"Avenir Next","Trebuchet MS",Verdana,sans-serif;
    font-size:clamp(16px,4.6vw,21px);font-weight:800;color:#334155;cursor:pointer;
    transition:transform .08s,box-shadow .08s;
  }
  .key:active{transform:translateY(3px);box-shadow:none}
  .key.wide{flex:2.4 1 0;font-size:clamp(11px,3.2vw,14px);color:#64748b}
  .typed-note{
    text-align:center;font-size:13.5px;font-weight:800;color:#b91c1c;margin:12px 0 0;
    min-height:20px;line-height:1.35;
  }
  .typed-note b{color:#15803d;font-family:"Avenir Next","Trebuchet MS",sans-serif;letter-spacing:.5px}
  .again-btn{
    display:block;margin:10px auto 0;border:none;font-family:inherit;font-size:14px;font-weight:800;
    color:#fff;background:linear-gradient(180deg,#fbbf24,#f59e0b);padding:11px 22px;border-radius:999px;
    box-shadow:0 4px 0 #d97706;cursor:pointer;
  }
  .again-btn:active{transform:translateY(4px);box-shadow:none}

  .play-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px;padding:0 4px}
  .hint-btn{
    border:none;font-family:inherit;font-size:14.5px;font-weight:800;color:#92400e;cursor:pointer;
    background:#fef3c7;padding:12px 20px;border-radius:999px;box-shadow:0 3px 0 #fde68a;
  }
  .hint-btn:active{transform:translateY(3px);box-shadow:none}
  .mode-tag{font-size:11.5px;font-weight:800;color:#94a3b8}

  /* success flash */
  .flash{
    position:fixed;inset:0;display:none;place-items:center;z-index:60;pointer-events:none;
  }
  .flash.on{display:grid}
  .flash .box{
    background:rgba(255,255,255,.96);border-radius:26px;padding:22px 30px;text-align:center;
    box-shadow:0 18px 40px rgba(15,23,42,.22);animation:pop .34s cubic-bezier(.34,1.56,.64,1);
  }
  .flash .st{font-size:34px;letter-spacing:3px;line-height:1.1}
  .flash .wd{
    font-size:26px;font-weight:900;color:var(--blue);margin-top:4px;
    font-family:"Avenir Next","Trebuchet MS",Verdana,sans-serif;letter-spacing:.5px;
  }
  .flash .msg{font-size:13px;font-weight:800;color:#16a34a;margin-top:2px}

  /* ---------- result ---------- */
  .result-head{text-align:center;padding:6px 0 14px}
  .result-head .big{font-size:64px;line-height:1;animation:bob 2s infinite}
  .result-head h2{margin:8px 0 4px;font-size:24px;letter-spacing:-.6px}
  .result-head p{margin:0;font-size:14px;color:var(--muted);font-weight:700}
  .result-stars{
    display:flex;align-items:center;justify-content:center;gap:8px;background:#fff;border-radius:20px;
    padding:14px;margin-bottom:14px;font-weight:900;color:#b45309;font-size:16px;
    box-shadow:0 5px 0 #f0e2cd;
  }
  .result-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:9px;margin-bottom:18px}
  .rl{
    background:#fff;border-radius:16px;padding:9px 6px;text-align:center;
    box-shadow:0 3px 0 #e8eef8;display:flex;flex-direction:column;align-items:center;gap:2px;
  }
  .rl .e{font-size:24px;line-height:1.1}
  .rl .w{font-size:11.5px;font-weight:800;color:#334155;word-break:break-word;line-height:1.15}
  .rl .s{font-size:10px;letter-spacing:-1px}
  .result-actions{display:flex;flex-direction:column;gap:11px}
  .big-btn{
    border:none;font-family:inherit;font-size:16px;font-weight:900;padding:17px;border-radius:18px;
    background:#fff;color:#334155;box-shadow:0 4px 0 #e2e8f0;cursor:pointer;
  }
  .big-btn:active{transform:translateY(4px);box-shadow:none}
  .big-btn.primary{color:#fff;background:linear-gradient(180deg,#4ade80,#16a34a);box-shadow:0 4px 0 #15803d}

  /* ---------- book ---------- */
  .book-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  .book-head h2{margin:0;font-size:20px;letter-spacing:-.5px}
  .book-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:11px}
  .wc{
    border:none;font-family:inherit;background:#fff;border-radius:20px;padding:12px 8px 10px;
    text-align:center;cursor:pointer;box-shadow:0 4px 0 #e6eefa;transition:transform .1s;
    display:flex;flex-direction:column;align-items:center;gap:2px;
  }
  .wc:active{transform:translateY(4px);box-shadow:none}
  .wc .e{font-size:32px;line-height:1.1}
  .wc .w{font-size:12.5px;font-weight:900;color:#1e293b;font-family:"Avenir Next","Trebuchet MS",sans-serif;word-break:break-word}
  .wc .k{font-size:10.5px;color:var(--muted);font-weight:700}
  .wc .s{font-size:11px;letter-spacing:-1px;margin-top:1px}
  .wc.locked{background:#f8fafc}
  .wc.locked .w{color:#94a3b8}

  /* modal */
  .modal{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;place-items:center;z-index:70;padding:20px}
  .modal.on{display:grid}
  .modal .sheet{
    background:#fff;border-radius:26px;padding:24px 20px;max-width:400px;width:100%;text-align:center;
    animation:pop .3s cubic-bezier(.34,1.56,.64,1);box-shadow:0 22px 50px rgba(15,23,42,.3);
  }
  .modal .e{font-size:66px;line-height:1}
  .modal .w{
    font-size:30px;font-weight:900;color:var(--blue);font-family:"Avenir Next","Trebuchet MS",sans-serif;
    letter-spacing:.5px;margin-top:6px;
  }
  .modal .k{font-size:15px;font-weight:800;color:var(--muted);margin-top:2px}
  .modal .t{
    margin-top:14px;background:#fffbeb;border:2px dashed #fcd34d;border-radius:14px;padding:11px 13px;
    font-size:13.5px;font-weight:700;color:#92400e;line-height:1.45;text-align:left;
  }
  .modal .close{
    margin-top:16px;width:100%;border:none;font-family:inherit;font-size:15px;font-weight:800;
    padding:14px;border-radius:16px;background:#eff6ff;color:#2563eb;cursor:pointer;
  }

  /* confetti */
  #confetti{position:fixed;inset:0;pointer-events:none;z-index:80;overflow:hidden}
  .cf{position:absolute;top:-20px;width:9px;height:14px;border-radius:2px;will-change:transform;animation:fall linear forwards}
  @keyframes fall{
    0%{transform:translate3d(0,0,0) rotate(0)}
    100%{transform:translate3d(var(--dx),105vh,0) rotate(var(--rot))}
  }
  .flystar{position:fixed;font-size:22px;z-index:85;pointer-events:none;transition:transform .7s cubic-bezier(.3,-0.2,.7,1),opacity .7s}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <span class="logo">🚌</span>
      <div>
        <h1>탈것 스펠링 모험</h1>
        <p>영어 단어 12개를 정복하자!</p>
      </div>
    </div>
    <div class="score">⭐ <b id="starTotal">0</b></div>
  </header>

  <!-- HOME -->
  <section class="screen on" id="screen-home">
    <div class="filters" id="filters">
      <button class="chip on" data-filter="all">전체 12개</button>
      <button class="chip" data-filter="focus">✏️ 자주 틀리는 <span id="focusCount">8</span>개</button>
    </div>

    <div class="modes">
      <button class="mode-card" data-mode="blocks">
        <span class="mode-emoji">🧩</span>
        <span class="mode-txt"><b>블록 맞추기</b><i>글자를 하나씩 끼워서 완성해요</i></span>
        <span class="mode-level">쉬움</span>
      </button>
      <button class="mode-card" data-mode="fill">
        <span class="mode-emoji">🎈</span>
        <span class="mode-txt"><b>빈칸 톡톡</b><i>어려운 부분만 콕! 알파벳 방울을 눌러요</i></span>
        <span class="mode-level">핵심</span>
      </button>
      <button class="mode-card" data-mode="type">
        <span class="mode-emoji">🎤</span>
        <span class="mode-txt"><b>직접 써보기</b><i>듣고 내가 직접 타이핑!</i></span>
        <span class="mode-level">도전</span>
      </button>
    </div>

    <button class="book-btn" id="btnBook">📖 내 단어 도감 <b id="masteredCount">0/12</b></button>

  <!-- RESULT -->
  <section class="screen" id="screen-result">
    <div class="result-head">
      <div class="big" id="resEmoji">🎉</div>
      <h2 id="resTitle">잘했어요!</h2>
      <p id="resSub">12개를 모두 만났어요</p>
    </div>
    <div class="result-stars">⭐ 이번에 모은 별 <b id="resStars">0</b>개</div>
    <div class="result-list" id="resList"></div>
    <div class="result-actions">
      <button class="big-btn primary" id="btnAgain">🔁 한 번 더</button>
      <button class="big-btn" id="btnHome">🏠 게임 고르기</button>

    <div class="book-head">
      <button class="icon-btn" id="btnBookBack">←</button>

<div class="modal" id="modal">
  <div class="sheet">
    <div class="e" id="mEmoji">🚌</div>
    <div class="w" id="mWord">bus</div>

    <button class="close" id="mClose">닫기</button>
  </div>

<div id="confetti"></div>

<script>
(function(){
  'use strict';

  /* ================= data ================= */
  var WORDS = [
    {en:'bus', ko:'버스', emoji:'🚌', focus:false,
      tip:'b·u·s 세 글자! "바스"가 아니라 "버스" 🚌',
      fill:{pattern:'b?s', pool:['u','a','o','e']}},
    {en:'car', ko:'자동차', emoji:'🚗', focus:false,
      tip:'c는 "크"가 아니라 "ㄲ" 소리! c·a·r = 카 🚗',
      fill:{pattern:'?ar', pool:['c','k','s','t']}},
    {en:'taxi', ko:'택시', emoji:'🚕', focus:false,
      tip:'t·a·x·i! 여기서 x는 "크스" 소리 🚕',
      fill:{pattern:'t??i', pool:['a','x','e','o']}},
    {en:'train', ko:'기차', emoji:'🚂', focus:true,
      tip:'tr + ai + n! ai는 짝꿍 모음 "에이" 🚂',
      fill:{pattern:'tr??n', pool:['a','i','e','o','u']}},
    {en:'airplane', ko:'비행기', emoji:'✈️', focus:true,
      tip:'air(허공) + plane(비행기)! 끝에 마법의 e가 숨어 있어요 ✈️',
      fill:{pattern:'airplan?', pool:['e','a','i','o']}},
    {en:'subway', ko:'지하철', emoji:'🚇', focus:false,
      tip:'sub(아래) + way(길)! 지하로 다니는 길 🚇',
      fill:{pattern:'s?bw??', pool:['u','a','y','o','e']}},
    {en:'on foot', ko:'걸어서', emoji:'🚶', focus:true,
      tip:'"on"하고 "foot" 사이에 꼭 띄어쓰기! oo는 "우~" 소리 🚶',
      fill:{pattern:'?n f??t', pool:['o','u','a','e']}},
    {en:'bike', ko:'자전거', emoji:'🚲', focus:true,
      tip:'b·i·k + 마법의 e! 끝의 e는 소리가 없어요 🚲',
      fill:{pattern:'b?k?', pool:['i','e','a','o']}},
    {en:'boat', ko:'배', emoji:'⛵', focus:true,
      tip:'oa는 짝꿍 모음 "오우"! b·oa·t ⛵',
      fill:{pattern:'b??t', pool:['o','a','e','i']}},
    {en:'motorcycle', ko:'오토바이', emoji:'🏍️', focus:true,
      tip:'motor(모터) + cycle(바퀴)! o를 두 번 써요 🏍️',
      fill:{pattern:'m?t?rcycle', pool:['o','a','u','e']}},
    {en:'helicopter', ko:'헬리콥터', emoji:'🚁', focus:true,
      tip:'heli + cop + ter, 세 덩어리로 기억해요 🚁',
      fill:{pattern:'helic?pt?r', pool:['o','e','a','u']}},
    {en:'spaceship', ko:'우주선', emoji:'🚀', focus:true,
      tip:'space(우주) + ship(배)! c는 "스", 끝 e는 조용 🚀',
      fill:{pattern:'sp?c?sh?p', pool:['a','e','i','o','u']}}
  ];
  var BY_EN = {};
  WORDS.forEach(function(w){ BY_EN[w.en] = w; });
  var FOCUS = WORDS.filter(function(w){ return w.focus; });
  var KEYS = ['qwertyuiop','asdfghjkl','zxcvbnm'];
  var MODE_NAME = {blocks:'🧩 블록 맞추기', fill:'🎈 빈칸 톡톡', type:'🎤 직접 써보기'};
  var MODE_TAG = {blocks:'블록 맞추기', fill:'빈칸 톡톡', type:'써보기'};
  var STORE_KEY = 'spelling_transport_v1';

  /* ================= storage ================= */
  var prog = {v:1, stars:{}, plays:0, best:0};
  function loadProg(){
    try{
      var raw = localStorage.getItem(STORE_KEY);
      if(raw){
        var o = JSON.parse(raw);
        if(o && typeof o === 'object'){
          prog.v = 1;
          prog.stars = (o.stars && typeof o.stars === 'object') ? o.stars : {};
          prog.plays = o.plays || 0;
          prog.best = o.best || 0;
        }
      }
    }catch(e){}
  }
  function saveProg(){
    try{ localStorage.setItem(STORE_KEY, JSON.stringify(prog)); }catch(e){}
  }
  function starOf(en){ return prog.stars[en] || 0; }
  function totalStars(){
    var n = 0;
    WORDS.forEach(function(w){ n += starOf(w.en); });
    return n;
  }
  function masteredCount(){
    var n = 0;
    WORDS.forEach(function(w){ if(starOf(w.en) >= 1) n++; });
    return n;
  }

  /* ================= sound ================= */
  var AC = null, voices = [];
  function unlockAudio(){
    if(!AC){
      try{ AC = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ AC = null; }
    }
    if(AC && AC.state !== 'running'){ try{ AC.resume(); }catch(e){} }
    if('speechSynthesis' in window){
      loadVoices();
      try{
        var u = new SpeechSynthesisUtterance(' ');
        u.volume = 0; u.lang = 'en-US';
        window.speechSynthesis.speak(u);
      }catch(e){}
    }
  }
  function beep(freq, start, dur, type, gain){
    if(!AC) return;
    var t = AC.currentTime;
    var o = AC.createOscillator(), g = AC.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t + start);
    g.gain.setValueAtTime(0.0001, t + start);
    g.gain.exponentialRampToValueAtTime(gain || 0.15, t + start + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + start + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(t + start); o.stop(t + start + dur + 0.06);
  }
  function sfx(name){
    unlockAudio();
    if(!AC) return;
    if(name === 'tap'){ beep(680, 0, 0.08, 'triangle', 0.10); }
    else if(name === 'good'){ beep(880, 0, 0.10, 'sine', 0.15); beep(1320, 0.09, 0.17, 'sine', 0.12); }
    else if(name === 'bad'){ beep(210, 0, 0.13, 'sawtooth', 0.09); beep(150, 0.10, 0.17, 'sawtooth', 0.08); }
    else if(name === 'combo'){ [784, 988, 1319].forEach(function(f, i){ beep(f, i * 0.07, 0.15, 'triangle', 0.13); }); }
    else if(name === 'win'){ [523, 659, 784, 1047, 1319].forEach(function(f, i){ beep(f, i * 0.11, 0.24, 'sine', 0.15); }); }
    else if(name === 'star'){ beep(1568, 0, 0.10, 'sine', 0.10); beep(2093, 0.06, 0.12, 'sine', 0.08); }
  }
  function loadVoices(){
    try{ voices = window.speechSynthesis.getVoices() || []; }catch(e){ voices = []; }
  }
  if('speechSynthesis' in window){
    loadVoices();
    try{ window.speechSynthesis.addEventListener('voiceschanged', loadVoices); }catch(e){}
  }
  function speak(text, rate){
    if(!('speechSynthesis' in window)) return;
    unlockAudio();
    try{
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text);
      u.lang = 'en-US';
      u.rate = rate || 0.8;
      u.pitch = 1.05;
      u.volume = 1;
      var pref = null, i;
      for(i = 0; i < voices.length; i++){
        if(/^en[-_]US/i.test(voices[i].lang) && /samantha|google|aria|zira|jenny/i.test(voices[i].name)){ pref = voices[i]; break; }
      }
      if(!pref){ for(i = 0; i < voices.length; i++){ if(/^en[-_]US/i.test(voices[i].lang)){ pref = voices[i]; break; } } }
      if(!pref){ for(i = 0; i < voices.length; i++){ if(/^en/i.test(voices[i].lang)){ pref = voices[i]; break; } } }
      if(pref) u.voice = pref;
      window.speechSynthesis.speak(u);
    }catch(e){}
  }

  /* ================= helpers ================= */
  function $(id){ return document.getElementById(id); }
  function shuffle(arr){
    var a = arr.slice();
    for(var i = a.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function stars(n){ return '⭐'.repeat(n) + '☆'.repeat(3 - n); }

  /* ================= state ================= */
  var G = {
    mode:'blocks', filter:'all',
    queue:[], qi:0,
    wrong:0, hint:false, locked:false,
    streak:0, round:[]
  };

  function showScreen(name){
    ['home','play','result','book'].forEach(function(n){
      var el = $('screen-' + n);
      if(el) el.classList.toggle('on', n === name);
    });
    window.scrollTo(0, 0);
  }

  function updateScore(){
    $('starTotal').textContent = totalStars();
    $('masteredCount').textContent = masteredCount() + '/12';
    $('focusCount').textContent = FOCUS.length;
  }
  function updateProgress(){
    var total = G.queue.length || 1;
    var done = Math.min(G.qi, total);
    $('progBar').style.width = Math.round(done / total * 100) + '%';
    $('progText').textContent = Math.min(G.qi + 1, total) + '/' + total;
  }
  function updateCombo(){
    var el = $('combo');
    if(G.streak >= 2){
      el.textContent = '🔥 ' + G.streak;
      el.classList.add('on');
    }else{
      el.classList.remove('on');
    }
  }

  /* ================= game flow ================= */
  function startGame(mode){
    unlockAudio();
    G.mode = mode;
    var list = (G.filter === 'focus') ? FOCUS : WORDS;
    G.queue = shuffle(list);
    G.qi = 0;
    G.streak = 0;
    G.round = [];
    prog.plays = (prog.plays || 0) + 1;
    saveProg();
    $('modeTag').textContent = MODE_TAG[mode];
    showScreen('play');
    updateCombo();
    loadWord();
  }

  function loadWord(){
    if(G.qi >= G.queue.length){ finishRound(); return; }
    var w = G.queue[G.qi];
    G.wrong = 0; G.hint = false; G.locked = false;
    $('pEmoji').textContent = w.emoji;
    $('pKo').textContent = w.ko;
    $('pTip').hidden = true;
    $('pTip').textContent = w.tip;
    var pa = $('playarea');
    pa.style.animation = 'none';
    void pa.offsetWidth;
    pa.style.animation = '';
    updateProgress();
    renderMode(w);
    setTimeout(function(){ speak(w.en); }, 230);
  }

  function renderMode(w){
    var area = $('playarea');
    area.innerHTML = '';
    if(G.mode === 'blocks') buildBlocks(w, area);
    else if(G.mode === 'fill') buildFill(w, area);
    else buildType(w, area);
  }

  /* ---------- mode 1: letter blocks ---------- */
  function buildBlocks(w, area){
    var chars = w.en.split('');
    var correct = chars.filter(function(c){ return c !== ' '; });
    var slotsEl = document.createElement('div');
    slotsEl.className = 'slots';
    var tilesEl = document.createElement('div');
    tilesEl.className = 'tiles';

    var seq = [];
    chars.forEach(function(ch){
      if(ch === ' '){
        var g = document.createElement('div');
        g.className = 'slot gap';
        slotsEl.appendChild(g);
        return;
      }
      var s = document.createElement('div');
      s.className = 'slot';
      slotsEl.appendChild(s);
      seq.push(s);
    });

    var order = shuffle(correct);
    if(correct.length > 3 && order.join('') === correct.join('')){
      order = shuffle(correct);
    }
    var tiles = order.map(function(ch){
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'tile';
      b.textContent = ch;
      b.dataset.ch = ch;
      b.setAttribute('aria-label', ch + ' 글자');
      tilesEl.appendChild(b);
      return b;
    });

    var pos = 0;
    function markNext(){
      seq.forEach(function(s, i){ s.classList.toggle('next', i === pos); });
    }
    markNext();

    function tapTile(b){
      if(G.locked || b.classList.contains('used')) return;
      if(pos >= seq.length) return;
      var need = correct[pos];
      if(b.dataset.ch === need){
        var target = seq[pos];
        target.textContent = need;
        target.classList.add('filled');
        target.classList.remove('next');
        b.classList.add('used');
        pos++;
        sfx('tap');
        markNext();
        if(pos === seq.length) setTimeout(wordDone, 220);
      }else{
        G.wrong++;
        b.classList.add('shake');
        setTimeout(function(){ b.classList.remove('shake'); }, 430);
        sfx('bad');
        if(!$('pTip').hidden) return;
        $('pTip').hidden = false;
        $('pTip').textContent = '지금 필요한 글자는 "' + need + '" 예요. 다시 찾아보세요!';
        setTimeout(function(){
          if(!G.locked){ $('pTip').hidden = true; $('pTip').textContent = w.tip; }
        }, 2200);
      }
    }

    tiles.forEach(function(b){
      b.addEventListener('click', function(){ tapTile(b); });
    });

    area.appendChild(slotsEl);
    area.appendChild(tilesEl);

    G.hintAction = function(){
      G.hint = true;
      $('pTip').hidden = false;
      $('pTip').textContent = w.tip;
      var need = correct[pos];
      var found = null;
      tiles.forEach(function(b){
        if(!found && !b.classList.contains('used') && b.dataset.ch === need) found = b;
      });
      if(found){
        found.classList.add('hintme');
        setTimeout(function(){ found.classList.remove('hintme'); }, 2600);
      }
      sfx('tap');
    };
  }

  /* ---------- mode 2: missing letters ---------- */
  function buildFill(w, area){
    var pat = w.fill.pattern.split('');
    var row = document.createElement('div');
    row.className = 'fillrow';
    var blanks = [];

    pat.forEach(function(ch, i){
      var d = document.createElement('div');
      if(ch === ' '){
        d.className = 'fl space';
        d.textContent = ' ';
        row.appendChild(d);
        return;
      }
      if(ch === '?'){
        d.className = 'fl blank';
        d.dataset.idx = i;
        row.appendChild(d);
        blanks.push(d);
      }else{
        d.className = 'fl';
        d.textContent = ch;
        row.appendChild(d);
      }
    });

    var bub = document.createElement('div');
    bub.className = 'bubbles';
    var bubbles = shuffle(w.fill.pool).map(function(ch){
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'bubble';
      b.textContent = ch;
      b.dataset.ch = ch;
      b.setAttribute('aria-label', ch + ' 알파벳');
      bub.appendChild(b);
      return b;
    });

    var pos = 0;
    function markNext(){
      blanks.forEach(function(b, i){ b.classList.toggle('next', i === pos); });
    }
    markNext();

    function tapBubble(b){
      if(G.locked) return;
      if(pos >= blanks.length) return;
      var need = w.en.charAt(parseInt(blanks[pos].dataset.idx, 10));
      if(b.dataset.ch === need){
        blanks[pos].textContent = need;
        blanks[pos].classList.add('filled');
        blanks[pos].classList.remove('next');
        pos++;
        sfx('tap');
        markNext();
        if(pos === blanks.length) setTimeout(wordDone, 220);
      }else{
        G.wrong++;
        b.classList.add('shake');
        setTimeout(function(){ b.classList.remove('shake'); }, 430);
        sfx('bad');
        $('pTip').hidden = false;
        $('pTip').textContent = '이 자리에 들어갈 글자는 "' + need + '" 소리가 나요. 다시!';
        setTimeout(function(){
          if(!G.locked){ $('pTip').hidden = true; $('pTip').textContent = w.tip; }
        }, 2200);
      }
    }

    bubbles.forEach(function(b){
      b.addEventListener('click', function(){ tapBubble(b); });
    });

    area.appendChild(row);
    area.appendChild(bub);

    G.hintAction = function(){
      G.hint = true;
      $('pTip').hidden = false;
      $('pTip').textContent = w.tip;
      var need = w.en.charAt(parseInt(blanks[pos].dataset.idx, 10));
      var found = null;
      bubbles.forEach(function(b){
        if(!found && b.dataset.ch === need) found = b;
      });
      if(found){
        found.classList.add('hintme');
        setTimeout(function(){ found.classList.remove('hintme'); }, 2600);
      }
      sfx('tap');
    };
  }

  /* ---------- mode 3: type it ---------- */
  function buildType(w, area){
    var en = w.en;
    var boxesEl = document.createElement('div');
    boxesEl.className = 'typeboxes';
    var letterBoxes = [];
    en.split('').forEach(function(ch){
      var d = document.createElement('div');
      if(ch === ' '){ d.className = 'tb space'; }
      else { d.className = 'tb'; }
      boxesEl.appendChild(d);
      letterBoxes.push(d);
    });

    var note = document.createElement('div');
    note.className = 'typed-note';
    note.textContent = '듣고 알파벳을 눌러 써보세요';

    var kb = document.createElement('div');
    kb.className = 'kb';

    var typed = '';

    function refresh(){
      for(var i = 0; i < letterBoxes.length; i++){
        var b = letterBoxes[i];
        if(en.charAt(i) === ' '){ b.textContent = ''; continue; }
        b.textContent = typed.charAt(i) || '';
        b.classList.toggle('now', i === typed.length);
      }
    }
    refresh();

    function press(ch){
      if(G.locked) return;
      if(typed.length >= en.length) return;
      typed += ch;
      refresh();
      sfx('tap');
      if(typed.length === en.length) setTimeout(check, 180);
    }
    function back(){
      if(G.locked) return;
      typed = typed.slice(0, -1);
      note.textContent = '듣고 알파벳을 눌러 써보세요';
      note.style.color = '#94a3b8';
      letterBoxes.forEach(function(b){ b.classList.remove('bad'); });
      refresh();
    }
    function check(){
      if(typed === en){ wordDone(); return; }
      G.wrong++;
      sfx('bad');
      var wrongIdx = [];
      for(var i = 0; i < en.length; i++){
        if(en.charAt(i) === ' ') continue;
        if(typed.charAt(i) !== en.charAt(i)) wrongIdx.push(i);
      }
      var mark = (wrongIdx.length === 1) ? [letterBoxes[wrongIdx[0]]] : letterBoxes;
      mark.forEach(function(b){ b.classList.add('bad'); });
      setTimeout(function(){
        letterBoxes.forEach(function(b){ b.classList.remove('bad'); });
      }, 1200);
      note.innerHTML = '이렇게 써요 → <b>' + en + '</b>';
      note.style.color = '#b91c1c';
      typed = '';
      refresh();
    }

    KEYS.forEach(function(row){
      var r = document.createElement('div');
      r.className = 'kbrow';
      row.split('').forEach(function(ch){
        var k = document.createElement('button');
        k.type = 'button';
        k.className = 'key';
        k.textContent = ch;
        k.addEventListener('click', function(){ press(ch); });
        r.appendChild(k);
      });
      kb.appendChild(r);
    });
    var lastRow = document.createElement('div');
    lastRow.className = 'kbrow';
    if(en.indexOf(' ') >= 0){
      var sp = document.createElement('button');
      sp.type = 'button';
      sp.className = 'key wide';
      sp.textContent = 'space 띄어쓰기';
      sp.addEventListener('click', function(){ press(' '); });
      lastRow.appendChild(sp);
    }
    var del = document.createElement('button');
    del.type = 'button';
    del.className = 'key wide';
    del.textContent = '⌫ 지우기';
    del.addEventListener('click', back);
    lastRow.appendChild(del);
    kb.appendChild(lastRow);

    area.appendChild(boxesEl);
    area.appendChild(note);
    area.appendChild(kb);

    G.hintAction = function(){
      G.hint = true;
      $('pTip').hidden = false;
      $('pTip').textContent = w.tip;
      note.innerHTML = '첫 글자는 <b>' + en.charAt(0).toUpperCase() + '</b> 로 시작해요!';
      note.style.color = '#b45309';
      sfx('tap');
    };
  }

  /* ================= word complete ================= */
  function wordDone(){
    if(G.locked) return;
    G.locked = true;
    var w = G.queue[G.qi];
    var earned = (G.wrong === 0 && !G.hint) ? 3 : (G.wrong <= 2 ? 2 : 1);
    var prev = starOf(w.en);
    if(earned > prev){ prog.stars[w.en] = earned; }
    var perfect = (earned === 3);
    if(perfect){
      G.streak++;
      if(G.streak > (prog.best || 0)) prog.best = G.streak;
    }else{
      G.streak = 0;
    }
    G.round.push({en:w.en, stars:earned});
    saveProg();
    updateScore();
    updateCombo();
    sfx(perfect ? 'combo' : 'good');
    speak(w.en, 0.78);

    $('flashStars').textContent = stars(earned);
    $('flashWord').textContent = w.en;
    $('flashMsg').textContent = perfect ? '완벽해요! 실수 없이 통과 🎉'
      : (earned === 2 ? '정답! 조금만 더!' : '정답이에요!');
    $('flash').classList.add('on');
    flyStar(earned);
    if(perfect && G.streak >= 3) confetti(26);

    setTimeout(function(){
      $('flash').classList.remove('on');
      if(G.locked){
        G.qi++;
        loadWord();
      }
    }, perfect ? 1350 : 1150);
  }

  function finishRound(){
    G.locked = true;
    sfx('win');
    confetti(90);
    var sum = 0, perfects = 0;
    G.round.forEach(function(r){ sum += r.stars; if(r.stars === 3) perfects++; });
    $('resStars').textContent = sum;
    $('resEmoji').textContent = (perfects === G.round.length && G.round.length > 0) ? '🏆' : '🎉';
    $('resTitle').textContent = (perfects === G.round.length && G.round.length > 0) ? '완벽해요!' : '잘했어요!';
    $('resSub').textContent = G.round.length + '개 중 ' + perfects + '개를 완벽하게 맞혔어요';

    var list = $('resList');
    list.innerHTML = '';
    G.round.forEach(function(r){
      var w = BY_EN[r.en];
      var d = document.createElement('div');
      d.className = 'rl';
      d.innerHTML = '<div class="e">' + w.emoji + '</div>' +
                    '<div class="w">' + w.en + '</div>' +
                    '<div class="s" style="color:#f59e0b">' + stars(r.stars) + '</div>';
      list.appendChild(d);
    });
    showScreen('result');
  }

  /* ================= effects ================= */
  function confetti(count){
    var box = $('confetti');
    var colors = ['#2563eb','#22c55e','#f59e0b','#ef4444','#8b5cf6','#ec4899','#06b6d4'];
    for(var i = 0; i < (count || 50); i++){
      (function(i){
        var p = document.createElement('div');
        p.className = 'cf';
        p.style.left = Math.random() * 100 + '%';
        p.style.background = colors[Math.floor(Math.random() * colors.length)];
        p.style.setProperty('--dx', (Math.random() * 160 - 80) + 'px');
        p.style.setProperty('--rot', (Math.random() * 900 - 450) + 'deg');
        var dur = 1.8 + Math.random() * 1.4;
        p.style.animationDuration = dur + 's';
        p.style.animationDelay = (Math.random() * 0.35) + 's';
        p.style.opacity = 0.95;
        if(Math.random() < 0.3){ p.style.borderRadius = '50%'; p.style.width = '11px'; p.style.height = '11px'; }
        box.appendChild(p);
        setTimeout(function(){ p.remove(); }, (dur + 0.6) * 1000);
      })(i);
    }
  }

  function flyStar(n){
    var from = $('pEmoji').getBoundingClientRect();
    var to = $('starTotal').getBoundingClientRect();
    var count = Math.max(1, n);
    for(var i = 0; i < count; i++){
      (function(i){
        setTimeout(function(){
          var s = document.createElement('div');
          s.className = 'flystar';
          s.textContent = '⭐';
          var sx = from.left + from.width / 2 - 12 + (i - 1) * 14;
          var sy = from.top + from.height / 2;
          s.style.left = sx + 'px';
          s.style.top = sy + 'px';
          document.body.appendChild(s);
          requestAnimationFrame(function(){
            var dx = to.left + to.width / 2 - sx - 10;
            var dy = to.top + to.height / 2 - sy;
            s.style.transform = 'translate(' + dx + 'px,' + dy + 'px) scale(.7)';
            s.style.opacity = '.2';
          });
          sfx('star');
          setTimeout(function(){ s.remove(); }, 800);
        }, i * 110);
      })(i);
    }
  }

  /* ================= book ================= */
  function renderBook(){
    var grid = $('bookGrid');
    grid.innerHTML = '';
    WORDS.forEach(function(w){
      var n = starOf(w.en);
      var b = document.createElement('button');
      b.className = 'wc' + (n === 0 ? ' locked' : '');
      b.innerHTML = '<div class="e">' + w.emoji + '</div>' +
                    '<div class="w">' + (n === 0 ? '??? ' : '') + w.en + '</div>' +
                    '<div class="k">' + w.ko + '</div>' +
                    '<div class="s" style="color:#f59e0b">' + (n === 0 ? '☆☆☆' : stars(n)) + '</div>';
      b.addEventListener('click', function(){ openWord(w); });
      grid.appendChild(b);
    });
  }

  function openWord(w){
    $('mEmoji').textContent = w.emoji;
    $('mWord').textContent = w.en;
    $('mKo').textContent = w.ko;
    $('mTip').textContent = w.tip;
    $('modal').classList.add('on');
    speak(w.en);
  }

  /* ================= events ================= */
  function bind(){
    document.querySelectorAll('.chip').forEach(function(c){
      c.addEventListener('click', function(){
        document.querySelectorAll('.chip').forEach(function(x){ x.classList.remove('on'); });
        c.classList.add('on');
        G.filter = c.dataset.filter;
        unlockAudio(); sfx('tap');
      });
    });
    document.querySelectorAll('.mode-card').forEach(function(c){
      c.addEventListener('click', function(){
        sfx('tap');
        startGame(c.dataset.mode);
      });
    });
    $('btnSpeak').addEventListener('click', function(){
      if(G.queue[G.qi]) speak(G.queue[G.qi].en);
      sfx('tap');
    });
    $('btnHint').addEventListener('click', function(){
      if(G.locked) return;
      if(G.hintAction) G.hintAction();
    });
    $('btnQuit').addEventListener('click', function(){
      sfx('tap');
      showScreen('home');
      G.locked = true;
    });
    $('btnAgain').addEventListener('click', function(){
      sfx('tap');
      startGame(G.mode);
    });
    $('btnHome').addEventListener('click', function(){
      sfx('tap');
      updateScore();
      showScreen('home');
    });
    $('btnBook').addEventListener('click', function(){
      sfx('tap');
      renderBook();
      showScreen('book');
    });
    $('btnBookBack').addEventListener('click', function(){
      sfx('tap');
      updateScore();
      showScreen('home');
    });
    $('mSpeak').addEventListener('click', function(){
      if($('mWord').textContent) speak($('mWord').textContent);
    });
    $('mClose').addEventListener('click', function(){
      $('modal').classList.remove('on');
      sfx('tap');
    });
    $('modal').addEventListener('click', function(e){
      if(e.target === $('modal')) $('modal').classList.remove('on');
    });
  }

  /* ================= boot ================= */
  loadProg();
  updateScore();
  bind();

  // sanity check of data (dev safety, silent)
  WORDS.forEach(function(w){
    if(w.fill.pattern.length !== w.en.length){
      console.warn('pattern length mismatch:', w.en, w.fill.pattern);
    }
  });
})();
</script>
</body>
</html>
